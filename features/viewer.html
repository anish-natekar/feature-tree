.todobox [hidden] { display: none !important; }
</style></head><body><div id="toolbar"></div><div id="viewport"><div id="canvas"><svg id="edges"></svg></div></div><script>window.FT_SNAPSHOT=[{"path": "SCHEMA.md", "text": "# Feature Tree Schema\n\nSource of truth for node format. `ft lint` enforces it. Obsidian-compatible: YAML frontmatter + `[[wikilinks]]`.\n\n## Design Philosophy\n\nFeature tree is a **project status indicator**, not an IDE or a spec-document system. Researched against Matt Pocock's Wayfinder skill, GitHub Spec Kit, and AWS Kiro before writing this down, specifically to reject the parts of those tools that don't fit:\n\n- **A meta-level map, one step above the code.** Agents now write more code than a human can review line by line; what a human can still review and steer is intent, decisions, facts and capabilities. The tree is that map: every feature/capability the project consists of, why it exists, what was decided and why, what is known (and from where), and what still needs a human. It is built by searching and mapping decisions as the project is made, and it grows with the project, updated by the same agents that change the code. A reader should understand the whole project and each feature's reasoning without opening a source file.\n- **Altitude rises toward the root; leaves sit closest to the code.** The root states the vision; branches describe capabilities and why they exist; leaves are the most detailed, written like good documentation: what it does, inputs and outputs, rules, edge cases, data it keeps, what was decided and why. Still never code: no function, class, file or tool names, and nothing tied to one programming language, so the same leaf would stay true if the project were rewritten in another language. A reader should be able to rebuild the behavior from a leaf, not read the implementation. Lint holds branches to a stricter standard than leaves.\n- **Natural language, not implementation detail.** A node captures intent, decisions, and rationale in prose a human can skim in seconds \u2014 not schemas, interfaces, or code. Implementation detail lives in the actual code, which is the source of truth for *how*; a node only needs to say *what* and *why*.\n- **One file per node, never fragmented.** Spec Kit and Kiro each split a feature across 3 files (spec/plan/tasks, or requirements/design/tasks). Feature tree deliberately rejects that: one markdown file, one fixed set of sections, so there's exactly one place to look. Don't propose splitting a node into companion files \u2014 split into child *nodes* instead if it's genuinely grown too big (see Split guards).\n- **Fog of war: don't pre-decompose vague scope.** If a child node's scope isn't sharp enough to write a real Abstract yet, it isn't ready to be a node. Keep it as a loose Todo or Question on the *parent* instead, and only promote it once you can state what it is precisely. `ft lint` nudges at this with a warning when an Abstract is still a `ft init`-style `DRAFT:` placeholder \u2014 that's a sign the node was created before its scope was actually known.\n- **Acceptance Tests read better as testable statements** (`Given X, when Y, then Z`, or `WHEN <condition> THE SYSTEM SHALL <behavior>`) than as free prose \u2014 a style tip borrowed from Kiro's EARS convention, not an enforced rule. `ft lint` doesn't check phrasing.\n\n## Layout\n\n- Tree root dir: `features/`.\n- Node with children: `features/<name>/<name>.md`, children sit in same folder (`<child>.md` or `<child>/<child>.md`).\n- Leaf: plain `<name>.md`.\n- File stem == `name` in frontmatter. Names unique across tree (wikilinks rely on it), kebab-case.\n\n## Frontmatter\n\n| field | rule |\n|---|---|\n| `name` | kebab-case, equals file stem |\n| `status` | `planned` \\| `in-progress` \\| `done` |\n| `parent` | name of parent node, derived from path; empty for roots |\n| `tests` | runnable command or test file path. Manual fallback: `manual` + checklist in Acceptance Tests |\n| `last_verified` | `YYYY-MM-DD` or empty; set when tests last passed |\n\n## Sections (fixed order, `##` headings)\n\n1. **Abstract**: what the feature is, why it is needed (intent).\n2. **Acceptance Tests**: tests that, when passing, mean feature implemented. Command or path, plus short description. Manual checklist allowed if `tests: manual`.\n3. **Todos**: `- [ ] (P1) text`. Priority P0 (urgent) to P3 (nice-to-have), or `P?` = unassigned: the human logged an issue without ranking it and the agent infers the priority (`ft todos --unassigned`), then rewrites the line. 3-state checkbox, same as Questions: `[ ]` not started, `[~]` in progress, `[x]` completed.\n4. **Questions**: open questions the agent could not settle alone, so the human can answer later or the agent can research them. Format below.\n5. **Implemented**: documentation of what exists. Reflect moves a confirmed `[x]` todo's prose here (see Reflect below), then removes it from Todos.\n6. **Facts & Details**: prose distilled from confirmed (`[x]`) questions \u2014 facts, decisions, constraints that came out of asking something. Reflect writes here, never todos.\n7. **Citations**: links to web pages, papers, docs. Supports claims made in either Implemented or Facts & Details.\n8. **Archived**: verbatim raw record of completed todo lines and confirmed question blocks, collapsed by default in the viewer. Written only by `ft reflect`; never hand-edit.\n9. **Children**: auto-generated by `ft index` as wikilinks.\n\n## Questions and blocked todos\n\n```\n- [ ] Q1: Which planner library fits a 6-DOF arm on a Pi?\n  - O: OMPL\n  - O: Custom RRT\n- [~] Q2: What rating does the power supply need?\n  - A (agent): 24 V 10 A. Sources: [datasheet](https://example.com)\n- [x] Q3: Which serial protocol?\n  - A: Modbus RTU.\n```\n- `[ ]` open \u00b7 `[~]` answered by the agent after research, human should confirm \u00b7 `[x]` answered by the human (or confirmed).\n- IDs `Q1`, `Q2`\u2026 are unique within the node, never reused. One-line answers.\n- A todo blocked on a question ends with `{blocked: Q1}` (same node). It counts as blocked only while that question is `[ ]`; `[~]` and `[x]` unblock it. Remove the marker once the question is answered.\n- A `done` node must have no open (`[ ]`) questions.\n- Questions are asked to the human with node path + id, e.g. `features/robot-arm/motion-planning.md Q1`.\n- Todos use the same three states: `[ ]` not started \u00b7 `[~]` in progress \u00b7 `[x]` completed, awaiting Reflect. `ft next` prefers an in-progress todo over a not-started one regardless of priority (finish what's started).\n\n## Reflect\n\nCompleting a todo or confirming a question doesn't delete it immediately \u2014 it just flips the checkbox to `[x]`. A separate **Reflect** stage archives and distills confirmed items in bulk, later:\n\n- `ft reflect --check [--under NODE]` \u2014 lists every confirmed `[x]` todo/question not yet archived; exit 1 if any exist. The Stop hook runs this automatically and blocks the turn until it's clean.\n- `ft reflect <node> --todo \"<exact text>\" --note \"<prose>\"` \u2014 moves that todo's raw line verbatim into Archived, removes it from Todos, appends the note to Implemented.\n- `ft reflect <node> --question Qn --note \"<prose>\"` \u2014 moves the question's full block verbatim into Archived, removes it from Questions, appends the note to Facts & Details.\n- Plan mode requires `ft reflect --check` to pass before starting a new plan \u2014 Reflect first, then plan.\n\n### Multiple-choice questions\n\nSame convention as the `AskUserQuestion` tool: offer a short list of concrete options instead of an open-ended question when there is one.\n\n- `- O: <option>` lines go directly under the question line, before any `- A:` line. Add with `ft ask <node> \"text\" --option \"OMPL\" --option \"Custom RRT\"`.\n- The **first** `O:` line is the recommended option. The viewer badges it \"Recommended\" and pre-highlights it \u2014 don't write the word \"Recommended\" into the text yourself.\n- Never write an \"Other\" option by hand. The viewer and the agent always add it implicitly as the last choice, revealing a free-text box when picked.\n- The answer line (`- A: ...`) is unchanged whether the human picked a listed option or typed something under \"Other\".\n- Plain open-ended questions (no `O:` lines) still work exactly as before \u2014 options are optional.\n\n## Cross-branch dependencies and unattended work\n\nTree position (parent/child) governs *organization*; it doesn't have to govern *sequencing*. A todo can be gated on a completely different branch of the tree, and a todo can be marked as needing a live human regardless of where it sits. Both researched from Matt Pocock's Wayfinder skill, adapted to this tool's node-granularity (todos have no stable id, so blocking targets a *node*, reusing the node status the tree already tracks).\n\n- `{blocked-by: node-name}` \u2014 this todo is excluded from `ft next`/`ft todos --ready` until `node-name`'s own `status` is `done`, no matter where that node sits in the tree. `ft todos` shows it with a `\u26d4 blocked by node-name` suffix instead of hiding it. `ft lint` warns if `node-name` doesn't exist.\n- `{hitl}` \u2014 this todo needs a live human (a decision only they can make, not something an agent should resolve alone). No marker = AFK-doable by an agent, the common case. `ft next --afk-only` / `ft todos --afk-only` filter `{hitl}` todos out \u2014 the call an unattended or looped work session makes instead of the plain form.\n\n## Progress\n\n`ft tree` shows a rollup percentage next to each node: `done / total` todos summed across that node and every descendant. A node with no todos anywhere in its subtree shows no percentage (not `0%`, since there's nothing to track, not nothing done). Purely derived from existing checkboxes \u2014 no extra frontmatter.\n\n## Time limits and TLE\n\n- Todo markers go at the end of the line, in any order: `{blocked: Q1}` `{blocked-by: node-name}` `{limit: 20m}` `{tle: 20m}` `{hitl}`.\n- `{limit: 90s|20m|2h}` overrides the default per-todo time budget for the headless driver (`ft work --task-limit`, default 20m).\n- `{tle: 20m}` is written by `ft work` when the agent ran out of time on that todo (Time Limit Exceeded): the process is killed, the todo is skipped by `ft next`, and `ft lint` warns. A human or planner then splits the todo or raises `{limit}` and removes `{tle}` (viewer: click the TLE chip).\n\n## Section index\n\nEvery node has one line under its title: `Jump: [Abstract](#abstract) \u00b7 \u2026`. `ft new` writes it, `ft index` repairs it, `ft lint` warns when missing. Do not edit it by hand. The viewer shows the same sections as jump chips.\n\n## Split guards (lint warnings)\n\n- Body over 600 words, over 12 open todos, over 8 children, or depth over 5 \u2192 split or regroup. `ft work` runs one split step per oversized node before doing todos.\n\n## Links\n\n- Feature link: `[[node-name]]` or `[[node-name|label]]`, anywhere in the body. Use instead of re-explaining another feature. Must name an existing node (lint error otherwise). Viewer shows teal chips; click navigates inside the viewer.\n- External link: plain markdown `[text](https://...)`. Viewer shows orange links with \u2197; click opens the browser. Put sources in `## Citations`; inline use is fine too.\n- Feature links in `## Children` are auto-generated and not counted as references.\n\n## Editing\n\n- Humans edit by hand, in the VS Code viewer drawer, or in the standalone `features/viewer.html` (`ft view`). All write the same markdown; edits change only the touched section.\n- Typing `[[` in any viewer field autocompletes node names.\n- Structural edits (CLI/skill only, no viewer buttons): `ft delete <name> [--subtree] [--yes]` (dry-run by default; without `--subtree`, direct children are reparented up to the deleted node's own parent), `ft rename <old> <new>` (updates children's `parent:` and every `[[old]]` wikilink tree-wide), `ft move <name> <new-parent|->` (relocates a node and its whole subtree). All three are filesystem operations \u2014 parent/child nesting is folder-derived, not just frontmatter.\n- `ft init [path]` bootstraps a rough-draft tree from an existing codebase (README + manifest + top-level dirs); refuses if `features/` is already non-empty. Follow up with the Plan-mode interview to refine the draft.\n\n## Rules\n\n- Body size: warn under 80 words, warn over 600, error over 900. Too big \u2192 split into children. Too small \u2192 merge into parent.\n- `done` requires: no unchecked todos, `tests` set, `last_verified` set.\n- `status` is computed, not hand-maintained: `ft index` sets it to `in-progress` if any todo is `[~]`; else `done` if there are zero open todos/questions and `tests`/`last_verified` are set; else `planned`. Hand-editing `status` is fine but `ft lint` warns if it drifts from the computed value \u2014 run `ft index` to resync.\n- Confirmed todo (`[x]`) left in Todos \u2192 lint warning (run `ft reflect`).\n- Questions to the human cite node path, e.g. `features/robot/arm/gripper.md`.\n"}, {"path": "feature-tree/autonomy/autonomy-in-ui.md", "text": "---\nname: autonomy-in-ui\nstatus: done\nparent: autonomy\ntests: cd vscode-feature-tree && npm test\nlast_verified: 2026-10-29\n---\n# autonomy-in-ui\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe visual panel and standalone viewer show the same briefing the command line gives, so a human can see what needs them and steer without a terminal. The plan files remain the source of truth; the viewer only presents what they already say.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes with new tests for the needs-you view and paused banner.\n\n## Todos\n\n## Questions\n\n\n## Implemented\n- Needs-you view: a tab in the todo and question box listing everything awaiting a human. Questions still open come first, and those blocking a todo come before the rest, followed by agent-answered questions to confirm, then todos only a human can do. Confirmed questions are excluded.\n- The tab label carries a count of open and agent-answered questions plus open human-only todos. With none, the view says nothing needs you.\n- Paused banner: when the pause switch file exists, the toolbar shows a banner with the pause reason, or a default wording when empty. The viewer reads that file along with the node files, in both the editor extension and the standalone browser version.\n- Filters that make no sense in the current view are hidden.\n- Human-only todos carry a person marker everywhere they appear, with a hint that unattended runs skip them.\n\n## Facts & Details\n- The weekly-style history digest is not shown here: the viewer reads plain files and has no access to version history, so it would need a new bridge in both hosts for little gain over the briefing.\n- The viewer does not itself pause or resume; it only displays state, keeping control in one place.\n- It reflects what is on disk, so it reads as read-only until a folder is chosen in the standalone version.\n\n## Citations\n\n## Archived\n- [x] (P2) add a Needs-you tab to the floating box built from open/agent-answered questions and HITL todos\n- [x] (P3) show a paused banner when `.paused` exists (needs the host to expose it)\n\n## Children\n"}, {"path": "feature-tree/autonomy/autonomy.md", "text": "---\nname: autonomy\nstatus: done\nparent: feature-tree\ntests: python3 -m unittest skill.tests.test_ft.AutonomyTests\nlast_verified: 2026-10-29\n---\n# autonomy\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nGoal: make the tree a self-managing control plane. A human glances at one briefing to see progress and the few things only they can decide, then walks away; agents keep working through everything else without being around, and every decision they made alone stays visible, reviewable and reversible. The tree on disk is the only shared state: the human steers by answering questions, confirming agent assumptions, tagging work HITL, and pausing; the agent steers by `ft next --afk-only`, `ft assume` and `ft ask`. This node groups the capabilities that serve that loop; each child owns one piece.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.AutonomyTests` passes, and `ft status` on this repo prints a briefing whose NEEDS YOU list matches `ft questions --open`.\n\n## Todos\n\n## Questions\n\n\n## Implemented\nProven end to end with a real unattended agent run: it finished the work it could, researched a decision it was blocked on, flagged that decision for human confirmation, and left a briefing listing exactly what the human still owes. A pause stops the run cleanly.\n\n## Facts & Details\n\n## Citations\n\n## Archived\n- [x] (P2) run `ft work` unattended end to end on a throwaway sample tree and confirm it finishes, pauses on `ft pause`, and leaves a clean `ft status` handoff\n\n## Children\n- [[autonomy-in-ui]] (done)\n- [[away-digest]] (done)\n- [[human-briefing]] (done)\n- [[kill-switch]] (done)\n- [[unattended-decisions]] (done)\n"}, {"path": "feature-tree/autonomy/away-digest.md", "text": "---\nname: away-digest\nstatus: done\nparent: autonomy\ntests: python3 -m unittest skill.tests.test_ft.DigestTests\nlast_verified: 2026-10-29\n---\n# away-digest\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nWhen a human returns after agents worked alone, they should not have to read diffs. The digest answers one question: what changed in the plan since I last looked? It is read-only and complements the briefing, which says what is owed now, while the digest says what already happened.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.DigestTests` passes; on a repo with history, `ft digest --since 1.day` lists completed work, new questions, assumed decisions and new nodes, and prints a clear line when nothing changed.\n\n## Todos\n\n## Questions\n\n## Implemented\n- Input: a point in time, given in ordinary phrasing such as one day or a date. Output: up to four lists, each with a count: finished work, questions raised, decisions made by an agent and still unconfirmed, and nodes added.\n- Source: the plan's version history within that period. Lines newly added as checked-off todos count as finished (question closures are not mistaken for todos); newly added open questions count as raised; agent-assumed answers count as decisions; newly created node files count as added.\n- Duplicates are collapsed, order of first appearance kept. A header repeats the chosen period. When nothing matches, it says nothing changed.\n- Failure: if the plan is not under version control, it reports that and fails.\n- Every fresh agent session opens with the briefing followed by the last day's digest, and the skill tells agents to read it when resuming after time away.\n\n## Facts & Details\n- It is available only on the command line; the viewer cannot read history.\n- Reading history rather than keeping a separate log means there is nothing extra to maintain and it cannot disagree with the plan.\n- A day is the default window for session start because that matches typical away time; humans can widen it.\n- Because it works from added lines, work done and reflected within the same period still shows once.\n\n## Citations\n\n## Archived\n- [x] (P1) `ft digest [--since WHEN]` summarizing finished todos, new questions, agent-assumed decisions and added nodes from git history of the plan\n- [x] (P2) mention the digest in the skill's resume step and in the session-start briefing hook\n\n## Children\n"}, {"path": "feature-tree/autonomy/human-briefing.md", "text": "---\nname: human-briefing\nstatus: done\nparent: autonomy\ntests: python3 -m unittest skill.tests.test_ft.AutonomyTests\nlast_verified: 2026-10-29\n---\n# human-briefing\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nOne command a human runs to take control of an agent-built project, in a single screen. The goal is that nothing hides: if an agent is stuck or guessed, it is listed here, ranked by urgency.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.AutonomyTests` (status tests) passes.\n\n## Todos\n\n## Questions\n\n\n## Implemented\n- Optional scope: restrict to one node and its descendants.\n- Pause line: if work is paused, the first line says so with the reason and how to resume.\n- Progress: todos done out of total with a percentage, plus counts of nodes by status. Archived todos count as done so the figure does not shrink as items are reflected.\n- Needs you, sorted most urgent first: lint errors and open questions that block a todo (with how many); other open questions; todos only a human can do; agent-answered questions to confirm; and timed-out todos to split. Open questions show the option the agent would pick. An empty list says nothing.\n- Agent can do alone: the count of ready todos (open, not blocked, not human-only, with a priority) and the single next pick under unattended rules, or a note that nothing is ready. Unreflected items appear as housekeeping.\n- Idle verdict: when the agent has nothing to do and nothing needs reflecting, it prints that stopping is correct and what remains is human work, so goal-driven or looping sessions can end cleanly.\n- Every new session starts from this briefing instead of a raw tree dump.\n\n## Facts & Details\n- It never changes anything.\n- Ranking by blocked-todo count puts the decision that unlocks the most work first.\n- The idle verdict exists because agents otherwise loop or invent work when only human items remain.\n\n## Citations\n\n## Archived\n- [x] (P1) `ft status` prints PROGRESS, NEEDS YOU, AGENT CAN DO ALONE and honours `--under`\n- [x] (P2) have the SessionStart hook print `ft status` instead of tree+next so every fresh session starts from the briefing\n\n## Children\n"}, {"path": "feature-tree/autonomy/kill-switch.md", "text": "---\nname: kill-switch\nstatus: done\nparent: autonomy\ntests: python3 -m unittest skill.tests.test_ft.AutonomyTests\nlast_verified: 2026-10-29\n---\n# kill-switch\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA human must be able to stop autonomous work immediately, without knowing process ids or editing anything. One command pauses, another resumes.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.AutonomyTests` (pause tests) passes.\n\n## Todos\n\n## Questions\n\n\n## Implemented\n- Pausing: takes an optional reason, defaulting to a generic one, and stores it in a small marker file inside the plan folder. Resuming deletes the marker; resuming when not paused is harmless.\n- Effects while paused: the next-work choice reports the pause and the reason instead of a todo, so skill-driven sessions stop picking work; the headless driver refuses to start another step and exits with a dedicated code; the end-of-turn guard stops nagging about unfinished checkpoints so the agent can end cleanly; the briefing opens with a pause line; the viewer shows a banner.\n- A step already running is not killed; the pause takes effect before the next step begins.\n- Questions, listing and editing still work, so a human can keep planning while paused.\n\n## Facts & Details\n- A plain file was chosen over a flag in a process or database: it is versioned and visible with the plan, can be set by hand or from another tool, and survives restarts.\n- The reason text is free-form and shown to anyone who looks, so agents know why.\n- The pause is global to a plan, not per node.\n\n## Citations\n\n## Archived\n- [x] (P1) `ft pause`/`ft resume` gate `ft next` and `ft work`, and show in `ft status`\n- [x] (P3) make the Stop/PostToolUse hooks also respect `.paused`\n\n## Children\n"}, {"path": "feature-tree/autonomy/unattended-decisions.md", "text": "---\nname: unattended-decisions\nstatus: done\nparent: autonomy\ntests: python3 -m unittest skill.tests.test_ft.AutonomyTests\nlast_verified: 2026-10-29\n---\n# unattended-decisions\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nWhen an agent works without a human and a todo waits on a question that has a recommended default, stalling wastes the whole run. This lets the agent adopt the default, clearly flagged, so work continues and the human reviews later.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.AutonomyTests` (assume tests) passes.\n\n## Todos\n\n## Questions\n\n\n## Implemented\n- Input: a node, a question number, and optionally which option to take (default: the first, the recommended one).\n- Effect: the question becomes agent-answered rather than closed, gets an answer line recording the chosen option with a note that it was assumed while unattended and is unconfirmed, and any todos tagged as waiting on that question are released.\n- Refusals, each with a message and no change: unknown node or question; question not currently open; question with no options (those need research or a human); option number out of range.\n- Review: assumed answers appear in the briefing's needs-you list as items to confirm, and the daily digest lists them as agent decisions. A human confirms by closing the question or reverses it by reopening.\n- Guidance for agents: only choices that are safe and reversible may be assumed. Irreversible, costly or security-relevant ones stay open for the human.\n\n## Facts & Details\n- The safety line is policy, not enforced by the tool: the tool cannot judge risk, so the skill instructs agents and the human audit trail catches mistakes.\n- Using an unconfirmed state instead of closing keeps the decision visible instead of silently settled.\n- Work built on an assumption is not rolled back automatically when a human reopens it; the human decides what to redo.\n\n## Citations\n\n## Archived\n- [x] (P1) `ft assume` answers an optioned open question as `[~]`, unblocks its todos, refuses option-less or closed questions\n- [x] (P2) document in SKILL.md when an unattended agent may assume vs must leave a question for the human\n\n## Children\n"}, {"path": "feature-tree/claude-hooks.md", "text": "---\nname: claude-hooks\nstatus: done\nparent: feature-tree\ntests: python3 -m unittest skill.tests.test_ft.HookTests\nlast_verified: 2026-10-28\n---\n# claude-hooks\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nAutomatic guard rails for an AI coding agent working on a plan, so correctness does not depend on the agent remembering the rules. Three guards exist. One rejects any edit that leaves a plan node invalid. One refuses to let the agent finish its turn while finished work has not been written back into the plan. One gives every fresh session a short briefing so it starts from the current state instead of from memory. The unreflected-work check behind the second guard is the same one the manual reflect step uses, so the guard and the manual step never disagree.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.HookTests -v` passes (3 tests: lint-blocks-on-error, stop-hook-checkpoint, context-hook).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Edit guard: runs after every file edit the agent makes. It only reacts to markdown files inside the plan folder; edits anywhere else are ignored. It re-checks the whole plan and, if any node is now invalid, sends the list of errors (node path plus message) back to the agent and asks it to fix them before continuing. Warnings never block.\n- Stop guard: runs when the agent tries to end its turn. It collects problems and, if there are any, refuses the stop and lists each one. The problems are: a confirmed todo or question that is not yet archived (the message names the node and the exact reflect step to run), a todo with no priority, and a node marked done that still has open todos.\n- The stop guard steps aside in two cases so it can never trap the agent. If the agent already tried to stop once and was refused, the next stop goes through. If a human has paused the plan, the agent may stop cleanly with no nagging.\n- Session briefing: when a session starts, the guard prints the plan status, a digest of what changed in the last day, and the next todo to work on. This is injected as context for the agent.\n- Installation is a small settings snippet that wires each guard to its event; the steps live in a readme beside the hook script.\n\n## Facts & Details\n- Output contract: feedback to the agent goes out as an error message with a blocking result; the briefing goes out as plain output that becomes session context.\n- Decision: the stop guard blocks only once per stop attempt. A guard that could block forever would be worse than the forgotten write-back it prevents.\n- Limitation: hooks cannot enforce time limits on a todo and cannot trigger context compaction; those stay with the work loop and the human.\n\n## Citations\n- [skill/SKILL.md](../../skill/SKILL.md)\n\n## Archived\n- [x] (P3) document the hook install steps (wiring `ft_hook.py` into `settings.json`) in a README, not just inline in `SKILL.md`\n\n## Children\n"}, {"path": "feature-tree/distribution.md", "text": "---\nname: distribution\nstatus: planned\nparent: feature-tree\ntests: manual\nlast_verified: 2026-10-28\n---\n# distribution\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nHow feature-tree reaches people other than its author. The source of truth is a public repository holding three things: the agent skill, the command-line planning tool and the editor extension. The skill and tool travel by cloning that repository. The editor extension has no real distribution channel yet. Today it is a developer-only local install: the extension folder is copied into the editor's user extensions directory. It is a plain copy, not a link, so after any change to the extension's interface assets they must be copied again or the panel keeps showing the old interface. There is no packaged installer file and no marketplace listing.\n\n## Acceptance Tests\nmanual checklist: repo is public and cloneable; `README.md` and `LICENSE` exist at the repo root; `vsce package` produces an installable `.vsix` without error.\n\n## Todos\n- [ ] (P3) tag a `v0.1.0` release once the extension install story is settled {hitl}\n\n## Questions\n- [~] Q1: How should the VS Code extension reach a install?\n  - O: Keep it local/dev-only (current \u2014 symlinked into `~/.vscode/extensions/`, no publisher id needed)\n  - O: Package a `.vsix` and share it directly (no Marketplace, no publisher id)\n  - O: Register a publisher id and publish to the VS Code Marketplace\n  - A (agent): assumed default 'Keep it local/dev-only (current \u2014 symlinked into `~/.vscode/extensions/`, no publisher id needed)' while unattended; unconfirmed, reopen to change\n\n## Implemented\n- Public repository with a permissive open-source license, a readme at the root, and an ignore list covering build output and installed dependencies.\n- Packaging fixes that were blocking real activation: the extension manifest pointed at the wrong entry point, so the extension never started. Launch and build configurations were added so a developer can run it in a debug host, and a permanent local install replaced the awkward workflow of reopening a second editor window for every change.\n- Current decision, assumed by the agent while unattended and not confirmed by a human: keep the extension local and developer-only, with no marketplace publisher. Reopen the question to change it.\n\n## Facts & Details\n- Why not publish yet: a marketplace listing needs a registered publisher identity, a decision only the owner can make.\n- Freshness rule: because the local install is a copy, a stale panel is the first thing to suspect when a fix in the extension does not appear. The standalone viewer has no such problem because it is regenerated as a whole.\n- A tagged first release is deferred until the install story is settled, and needs a human to decide.\n\n## Citations\n- [package.json](../../vscode-feature-tree/package.json)\n\n## Archived\n- [x] (P1) choose a real publisher id and decide whether to publish the extension to the VS Code Marketplace, vs. keeping it a local/dev-only install\n\n## Children\n"}, {"path": "feature-tree/feature-tree.md", "text": "---\nname: feature-tree\nstatus: in-progress\nparent: \ntests: manual\nlast_verified: 2026-10-28\n---\n# feature-tree\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA hierarchical planning method delivered as a Claude skill plus a small command line tool: a tree of markdown nodes kept next to the code and versioned with it, used to plan and steer work without touching project code during planning. This root node exists to dogfood the method on itself. It describes feature-tree's own subsystems (the command line tool, the editor extension, the standalone viewer, the hooks and distribution) the same way it would describe any other project's features. There is no single build or test command for the whole project. Each child has its own acceptance test, and this node's own test is manual: lint and index run clean across the whole tree.\n\n## Acceptance Tests\nmanual: `python3 skill/scripts/ft.py lint` reports 0 errors across all nodes (including this subtree); `python3 skill/scripts/ft.py tree` shows all 5 children under `feature-tree`.\n\n## Todos\n- [~] (P1) deepen every leaf node to behavior-level, language-independent documentation (what it does, inputs and outputs, rules, edge cases, kept data, decisions and why), keeping branches abstract\n\n## Questions\n\n## Implemented\n- Scaffolded this root and its children following the planning conventions in the skill, with real abstracts, tests, todos and notes on each node rather than placeholder text.\n- Wrote the Design Philosophy into the schema document: nodes hold natural-language intent and decisions only, never implementation detail; each node is one file and is never fragmented into separate spec, design and task files (an explicit rejection of GitHub Spec Kit and AWS Kiro's pattern); and vague scope is not decomposed into premature child nodes (fog of war). Writing acceptance tests as testable statements is noted as a style tip, not enforced.\nAll 13 flagged nodes rewritten in plain language; lint now enforces this altitude going forward.\n\n## Facts & Details\n\n## Citations\n- [SCHEMA.md](../SCHEMA.md)\n- [SKILL.md](../../skill/SKILL.md)\n\n## Archived\n- [x] (P2) write a `## Design Philosophy` section into `features/SCHEMA.md`: natural-language intent/decisions only (no implementation detail), one file per node never fragmented into separate spec/design/tasks files, and the fog-of-war rule (don't create a child node for scope that's still vague). Researched from Wayfinder, GitHub Spec Kit, and AWS Kiro.\n- [x] (P2) rewrite the nodes `ft lint` flags as \"reads like code docs\" so they state intent, decisions and facts in plain language, with commands kept only in Acceptance Tests\n\n## Children\n- [[autonomy]] (done)\n- [[claude-hooks]] (done)\n- [[distribution]] (planned)\n- [[ft-cli]] (done)\n- [[standalone-viewer]] (planned)\n- [[vscode-extension]] (planned)\n"}, {"path": "feature-tree/ft-cli/cross-branch-deps.md", "text": "---\nname: cross-branch-deps\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.DependencyTests\nlast_verified: 2026-10-28\n---\n# cross-branch-deps\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA way to say that one todo cannot start until some other node is finished, wherever either sits in the tree. Ordinary blocking only works within a node, through a question; this gate links work across branches, so a feature in one corner can wait on a capability built in another. A second marker flags todos that only a human can do, so unattended agent runs can leave them alone.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.DependencyTests -v` passes (4 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Blocked-by gate: a todo may name another node. While that node's status is anything other than done, the todo is not workable. It disappears from the next-work choice and from the ready listing, but still shows in the full todo listing with a note saying which node it waits on. The moment the target reaches done, the todo becomes eligible again with no edit needed.\n- Dangling targets: if the named node does not exist the gate does not hold the todo back (so a typo cannot freeze work forever), and the linter raises a warning so the typo is noticed.\n- Human-only marker: a todo tagged this way is still listed everywhere, labeled as needing a human. A filter option on both the next-work choice and the listing removes them, which is what unattended or looped runs use. The status briefing and the viewer show these todos in the human's inbox instead.\n- Both markers sit at the end of the todo line, in curly braces, and are stripped from the todo text when it is archived or matched.\n\n## Facts & Details\n- The gate is deliberately by node, not by todo: a node's status is the one signal that already summarizes whether its work and tests are complete, so no todo-to-todo references are needed and nothing breaks when todos are reflected away.\n- The gate never edits anything; it is computed fresh from current statuses on every read, so it cannot go stale.\n- Inspired by the Wayfinder approach of hiding work until its prerequisite lands.\n- The human-only marker is advisory for agents: it removes the todo from autonomous selection but does not stop an interactive agent from doing it if a human asks.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P1) add `{blocked-by: node-name}` todo marker (cross-branch dependency gate, independent of tree position) with `ft next`/`ft todos` exclusion while the target node isn't `done`; `ft lint` warns on a dangling target\n- [x] (P1) add `{hitl}` todo marker plus `--afk-only` on `ft next`/`ft todos` to filter HITL-tagged todos out for unattended/looped work sessions\n\n## Children\n"}, {"path": "feature-tree/ft-cli/ft-cli.md", "text": "---\nname: ft-cli\nstatus: done\nparent: feature-tree\ntests: python3 -m unittest skill.tests.test_ft\nlast_verified: 2026-10-28\n---\n# ft-cli\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe `skill/scripts/ft.py` command-line driver: the single source of truth for parsing, linting, and mutating feature nodes. One parser/serializer every surface (VS Code extension, standalone viewer, a future agent) can trust instead of each re-implementing the schema. See the children below for each capability's own detail: [[schema]], [[work-loop]], [[questions]], [[cross-branch-deps]], [[progress-rollup]], [[reflect]], [[structural-editing]], [[init]].\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft -v` passes (38 tests, aggregate across all children's test classes).\n\n## Todos\n\n## Questions\n\n## Implemented\n\n## Facts & Details\n\n## Citations\n- [skill/SKILL.md](../../../skill/SKILL.md)\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n- [[cross-branch-deps]] (done)\n- [[init]] (done)\n- [[progress-rollup]] (done)\n- [[questions]] (done)\n- [[reflect]] (done)\n- [[schema]] (done)\n- [[structural-editing]] (done)\n- [[work-loop]] (planned)\n"}, {"path": "feature-tree/ft-cli/init.md", "text": "---\nname: init\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.InitTests\nlast_verified: 2026-10-28\n---\n# init\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nBootstraps a rough-draft tree from an existing project so one that predates the planning tool does not start from a blank page. It produces a starting point for the planning interview, not a finished plan.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.InitTests -v` passes (2 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Input: the project folder to survey. Output: one root node plus one child node per top-level folder, and the path of the root is printed, followed by a nudge to run the planning interview next.\n- Naming: the root takes the project's declared name from its manifest when there is one, otherwise the folder name, lowercased and reduced to dashes and letters. Child names get the same treatment.\n- Root abstract: the first non-heading paragraph of the readme, else the manifest description, else a draft placeholder. Each child gets a one-line draft placeholder saying what its folder does.\n- Skipped folders: hidden folders, dependency and build output, virtual environments, editor settings, and the planning folder itself. Children are capped in number so a sprawling repository does not produce an unreadable tree. A folder that would collide with the root's name is dropped.\n- Refusal: if the planning folder already holds any node, init stops with an error and changes nothing. It never merges or overwrites.\n- Draft warning: the linter warns while an abstract still begins with the draft marker, so unrefined nodes stay visible until someone writes a real abstract or removes the node.\n\n## Facts & Details\n- Init reads only names and a few top-level files; it does not analyze source, because guessing intent from code would produce confident but wrong prose. The placeholders are intentionally obvious.\n- The draft warning is a fog-of-war nudge: a node whose scope cannot yet be stated sharply should live as a loose todo or question on its parent instead of a node.\n- Children are created flat under the root; deeper structure is left to the interview.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P3) `ft lint`: warn when an Abstract is still a `DRAFT:` placeholder left over from `ft init`\n\n## Children\n"}, {"path": "feature-tree/ft-cli/progress-rollup.md", "text": "---\nname: progress-rollup\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.RollupTests\nlast_verified: 2026-10-28\n---\n# progress-rollup\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA completion figure for any node, counting finished versus total todos across the node and everything beneath it, shown as a percentage next to each node in the tree view. It lets a reader see at a glance which branches are nearly done and which have barely started.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.RollupTests -v` passes (1 test).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Counting: every todo on a node counts once toward the total, and checked ones count as done. A parent adds its children's totals to its own, recursively, so the root reflects the whole project.\n- Display: the percentage is rounded to a whole number and prefixed to the node line in the tree view.\n- No todos, no badge: a subtree containing no todos at all shows no percentage. Showing zero would wrongly suggest nothing is finished when there is simply nothing to track.\n- Partly done todos (the in-progress state) count as not yet done.\n- The whole-project briefing computes its own figure slightly differently: it also counts todos already archived by reflection as done, because archiving removes them from the live list. The tree badge counts only todos still listed, so a node whose work was fully reflected away shows no badge rather than one hundred percent.\n\n## Facts & Details\n- Derived on demand from the node files; nothing is stored, so the number cannot drift from the plan.\n- The percentage measures todo count, not effort: a trivial todo and a large one weigh the same. This was accepted as the cheapest honest signal; priorities and time limits are not used as weights.\n- Questions do not count toward progress; they are tracked separately as things awaiting a human.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) add `rollup_progress()` (done/total todos across a node + its descendants) and show it in `ft tree` output\n\n## Children\n"}, {"path": "feature-tree/ft-cli/questions.md", "text": "---\nname: questions\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.QuestionOptionTests\nlast_verified: 2026-10-28\n---\n# questions\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nQuestions are how an agent or planner records a decision it cannot make alone. A question may carry a short list of candidate answers, which makes it quick for a human to settle and lets an unattended agent adopt a safe default.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.QuestionOptionTests -v` passes (3 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Asking: given a node and question text, the tool appends a new open question with the next free number on that node. Numbers are per node and only grow. Repeating the option argument adds candidate answers. Whitespace in text and options is collapsed to single spaces.\n- Options: stored as indented lines under the question. The first option is the recommended one and is displayed marked as such. An \"Other\" choice is always offered by viewers implicitly and is never written to the file.\n- States: open, answered by an agent but unconfirmed, and confirmed by a human. Listing shows open and agent-answered ones by default; flags narrow to open only or widen to everything. A question that blocks a still-open todo is tagged as blocking, so urgent ones stand out.\n- Lint: a question with only one option, or with repeated option text, draws a warning, since a single option is not a choice.\n- Closing: once confirmed, a question is archived and its outcome recorded as a fact on the node by the reflect step.\n\n## Facts & Details\n- Recommended-first ordering was chosen over a separate recommended marker so a question reads naturally as plain text and one fewer thing can disagree with the list.\n- Questions with no options are valid; they signal that research or a human is needed and are never auto-answered.\n- A question is the only way to pause a todo on a decision: the todo is tagged with the question's number and resumes when the question stops being open.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P3) lint check for degenerate MCQ options (duplicate option text, or a question with only one `- O:` line)\n\n## Children\n"}, {"path": "feature-tree/ft-cli/reflect.md", "text": "---\nname: reflect\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.ReflectTests\nlast_verified: 2026-10-28\n---\n# reflect\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe archive-and-distill stage of the work cycle. Once a todo or question is confirmed finished, reflecting it moves the original line, unchanged, into the node's archive and adds one short prose note saying what is now true. The node therefore reads as a summary of its current state rather than a pile of ticked checkboxes, while the archive keeps the full trail.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.ReflectTests -v` passes (5 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Inputs: a node, exactly one of a finished todo (identified by its exact text) or a confirmed question (by number), and a required note. Missing or ambiguous input is rejected with a message and nothing changes.\n- Todo effect: the line leaves the todo list, is appended to the archive as written, and the note is appended to the Implemented section.\n- Question effect: the question with all its option and answer lines leaves the question list, is appended to the archive, and the note is appended to Facts and Details.\n- Only items already confirmed can be reflected. An item that does not match is an error rather than a guess.\n- Check mode: lists every confirmed-but-unreflected item, optionally within one subtree, and reports a failing result when any exist. Nothing is written.\n- Notes should be plain behavior statements, not echoes of the task wording.\n\n## Facts & Details\n- Reflection is batched, not done at checkpoint time, so a crash mid-task never loses the checkbox: the cheap flip happens first and the distillation later.\n- The end-of-turn guard, the headless driver and the planning-mode gate all call the same check, so they can never disagree about what is pending.\n- Archived text is kept verbatim so history can be audited and the daily digest can still recognize finished work.\n- Open items and open questions are never touched by this step.\n\n## Citations\n- [skill/SKILL.md](../../../skill/SKILL.md)\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/ft-cli/schema.md", "text": "---\nname: schema\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.TodoStateTests\nlast_verified: 2026-10-28\n---\n# schema\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe node format itself: a small metadata header followed by nine sections in fixed order: Abstract, Acceptance Tests, Todos, Questions, Implemented, Facts and Details, Citations, Archived, Children. One file per node, one place to look. Everything else in the tool reads and writes this shape, and the linter enforces it.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.TodoStateTests -v` passes (2 tests: 3-state checkbox parse/format round-trip).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Metadata: name, status (planned, in progress or done), parent, a test command and a last-verified date. A node's name must be dashed lowercase and match its file; the parent must match where the file sits in the folder hierarchy, because nesting defines the tree.\n- Round trip: reading and rewriting an untouched node produces byte-identical text, so diffs only show real changes.\n- Todos: a checkbox with three states (not started, in progress, done), a priority from zero to three or unassigned, text, and optional trailing markers in braces. The next-work choice prefers an in-progress todo over a higher-priority one not yet started, so interrupted work finishes first.\n- Questions: open, agent-answered or confirmed, optionally with options and an answer line.\n- Status is derived: in progress if any todo is in progress; done only with no open todos or questions and both a test command and a verification date; otherwise planned. Indexing refreshes it and the section jump line.\n- Lint errors: wrong section order, malformed todo or question lines, duplicate question numbers, impossible status, bad dates, broken parent or wikilink targets, size above the hard limit. Warnings: under 80 or over 600 words, missing tests, stale jump line or status, unassigned priorities, too many open todos or children, excessive depth, prose that reads like code docs.\n\n## Facts & Details\n- A fixed layout was chosen over free-form notes so tools and viewers can parse without guessing and humans always know where to look.\n- Three todo states mirror question states, avoiding a separate vocabulary.\n- The hard size limit is 900 words; past it a node must be split into children.\n\n## Citations\n- [skill/scripts/ft.py](../../../skill/scripts/ft.py)\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) add a dedicated test class for `ft lint`'s base rules (schema-order errors, size warnings, stale Jump line, broken parent/child/wikilink references) \u2014 currently only exercised incidentally through other test classes' fixtures, not tested directly\n\n## Children\n"}, {"path": "feature-tree/ft-cli/structural-editing.md", "text": "---\nname: structural-editing\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.StructuralEditTests\nlast_verified: 2026-10-28\n---\n# structural-editing\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nRestructuring the tree itself: deleting, renaming and moving nodes. Because parent and child relationships come from folder nesting, each of these changes files on disk, so doing it by hand risks broken links and mismatched parents. The tool performs them consistently so users never edit paths.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.StructuralEditTests -v` passes (7 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Delete: by default the node's children are reattached to its own parent (or the top level if it had none) and only then is the node removed. Optionally the whole subtree is removed. Without explicit confirmation it only previews what would happen and changes nothing.\n- Rename: the new name must be unique and in dashed lowercase form. The node's file and folder are renamed, its name field updated, its children's parent field updated, and every link to it anywhere in the tree, including links with a heading or alias suffix, is rewritten.\n- Move: reattaches a node, with all its descendants, under a new parent, or at the top level when given the root marker. A parent that does not exist, the current parent, or one of the node's own descendants is rejected. If the target parent was a plain file it is first promoted to a folder.\n- After any of these the section index and statuses are refreshed.\n- Folder nodes: a node with children lives in a folder of its own name; moving or deleting one carries or removes the whole folder.\n\n## Facts & Details\n- Preview-by-default on delete follows from irreversibility: removing nodes destroys planning history that may only exist in the working tree.\n- Reparenting rather than cascading is the default because deleting a branch usually means merging it away, not discarding its children's work.\n- Links are rewritten tree-wide on rename so no reader ever follows a dead reference.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/ft-cli/work-loop.md", "text": "---\nname: work-loop\nstatus: planned\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.WorkTests skill.tests.test_ft.MarkerTests\nlast_verified: 2026-10-28\n---\n# work-loop\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe headless driver that works through the plan with no human present. It repeatedly starts a fresh agent session for one step, then checks the plan on disk to decide what to do next, until nothing is left. The plan files, not any session memory, carry all the state.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.WorkTests skill.tests.test_ft.MarkerTests -v` passes (10 tests: work-loop triage/limit/abort behavior, `{limit}`/`{tle}` marker parsing and lint).\n\n## Todos\n- [ ] (P2) tune default `--task-limit`/`--max-tle` once there's real usage data from running `ft work` on a non-sample tree {hitl}\n\n## Questions\n\n## Implemented\n- Step choice, in priority order: split an oversized node (too long or more than twelve open todos), reflect confirmed items, triage todos with no priority, do the next ready todo, research open questions once. When none applies the run ends and prints any open questions for the human.\n- Preconditions each round: the pause switch must be off (otherwise it stops with its own exit code) and the plan must have no lint errors.\n- Time budget: each todo has a default limit, overridable per todo with a duration such as twenty minutes. Other step kinds use a longer shared limit. On expiry the session's entire process group is killed, and a work todo is tagged as timed out so it is skipped from then on. A timed-out non-work step stops the run.\n- Stopping conditions: step cap reached (default ten), several timeouts in a row (default three), the same todo still next after a full pass, no plan change after a work step, or the agent exiting with an error. Each has a distinct exit code.\n- Logs of each step are kept; the last lines are echoed. A dry run shows what would run.\n- The driver never bypasses permissions on its own; the caller supplies them.\n\n## Facts & Details\n- One fresh session per step keeps context small and makes every step restartable.\n- Progress is detected by hashing the plan files, which catches an agent that claims success but changed nothing.\n- Defaults are placeholders awaiting real usage data.\n- A real run on a throwaway project with the small model completed a todo once edits and a narrow set of commands were permitted; each node's own test command must be permitted too.\n\n## Citations\n- [skill/SKILL.md](../../../skill/SKILL.md)\n\n## Archived\n- [x] (P1) `ft work`'s real `claude` invocation needs `--allowedTools` tuned so Bash commands (e.g. running a node's own test suite) aren't denied under `acceptEdits` mode during a real headless run\n\n## Children\n"}, {"path": "feature-tree/standalone-viewer.md", "text": "---\nname: standalone-viewer\nstatus: planned\nparent: feature-tree\ntests: manual\nlast_verified: 2026-10-28\n---\n# standalone-viewer\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA single-file viewer that opens in an ordinary browser, for anyone without the editor extension or a notes app. It needs no server and no build step. It contains exactly the same tree parsing, graph drawing and styling as the editor extension, so what a person sees there is what they see here. The only difference is the host: instead of the editor's message channel, a small browser host reads and writes plan files in a folder the person picks. The generate command rebuilds the file from the live extension sources, so the two surfaces cannot drift apart.\n\n## Acceptance Tests\nmanual: open `features/viewer.html` in a browser, pick the `features/` folder when prompted, confirm the graph renders with the same colors/drawer behavior as the VS Code graph panel.\n\n## Todos\n- [ ] (P3) do an actual manual pass in a real browser \u2014 so far only verified indirectly via the jsdom test suite in `vscode-feature-tree/test/`, never opened for real {hitl}\n\n## Questions\n\n## Implemented\n- Opening: the page loads already populated from a snapshot of the plan taken when the file was generated. In this state it is read-only, and an edit attempt shows a message telling the person to pick the plan folder. Before this snapshot existed the page opened blank until a folder was chosen; that was a genuine defect, not a browser quirk.\n- Picking a folder: the person grants read and write access to the plan folder through the browser's native folder chooser. The viewer then reads every markdown file in it, including nested ones, plus the marker file that says a human paused agent work, and switches from snapshot to live mode.\n- Live updates: while the page is visible it rescans the folder every second and a half and redraws only if some file changed, so edits made by agents or other tools appear without a reload.\n- Writing: edits made in the page are written back to the same file, but only to markdown files that already exist inside the chosen folder. Paths that are empty, climb upward, or do not end in the markdown extension are rejected, and the viewer never creates files.\n\n## Facts & Details\n- Why a snapshot rather than an empty state: a first-time visitor sees a populated map immediately, which is the point of a shareable viewer.\n- Why shared code: one implementation for both surfaces means every fix to cards, glyphs or progress badges reaches the viewer on the next regeneration.\n- Verification gap: so far it has only been exercised through a simulated browser test suite, never opened by hand in a real browser. That manual pass needs a human.\n\n## Citations\n- [features/SCHEMA.md](../SCHEMA.md)\n\n## Archived\n- [x] (P3) regenerate `features/viewer.html` (`ft view`) after the blocked-by/HITL glyphs + progress-rollup badge land in `media/` {blocked-by: vscode-extension}\n- [x] (P1) diagnose the earlier \"blank viewer.html\" report \u2014 still need the browser name and any console error to reproduce; not yet actionable {hitl}\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/drawer-widgets.md", "text": "---\nname: drawer-widgets\nstatus: done\nparent: vscode-extension\ntests: npm test\nlast_verified: 2026-10-28\n---\n# drawer-widgets\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe reusable pieces inside the detail drawer that appears when a node is selected: section cards, the todo row, and the multiple-choice question card. The same pieces appear in the graph panel, in a single-node editor tab, and in the floating todo and question box, so a todo or question looks and behaves the same everywhere. They turn plan markers into visible controls: a three-state checkbox on todos, a blocked glyph, a human-only badge, a node picker for blocking, and a radio-style card for questions that offer choices.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (shared suite; relevant tests: \"drawer: ...\", \"todo row: ...\", \"MCQ: ...\", \"questions: ...\", \"blocked-by node gates the todo... shown in drawer and floating box\").\n\n## Todos\n\n## Questions\n\n## Implemented\n- Todo row: collapsed it shows only the state selector, a coloured priority badge and the text, so a long list stays scannable. Expanding a row reveals priority, time limit, blocked-on and blocked-by controls and a human-only toggle. A delete control removes the row. Edits save after a short pause in typing, and on leaving the field.\n- State: each todo is open, in progress or done, picked directly from a selector rather than clicked through a cycle. Choosing done also marks it complete.\n- Markers: a blocked glyph appears when the todo waits on a question that is still open, or on a node that is not yet done. A different glyph shows a todo that was aborted at its time limit. A person badge marks a todo that needs a live human and is skipped by unattended runs. The expanded row can edit all of these. The blocked-on choice lists only questions that are still open (plus any already set), so it does not appear when there is nothing to block on.\n- Priority colours match the floating box so the same urgency has the same colour in both.\n- Question card: when a question lists options, it shows a radio list with the first option badged as recommended. The badge is display only and is never saved. An extra Other row is always added and reveals the free-text answer flow. Questions without options use the free-text flow unchanged.\n- Cleanup rule: when a question is answered or removed, any todo blocked on it loses that marker.\n\n## Facts & Details\n- Decision: the first option is the recommendation, mirroring how agents phrase multiple-choice questions, so no extra data is stored.\n- Decision: collapsed rows hide secondary controls so the list does not become a wall of boxes.\n- Floating box: a draggable window with tabs for todos, questions and items that need a human. Filters cover priority, question state, subtree, text and done items. The human tab gathers open and agent-answered questions, blockers first, plus open human-only todos.\n- Data kept: nothing beyond the node's own markdown; every control rewrites its section in place.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) drawer: render `{blocked-by}`/`{hitl}` glyphs on todo rows (dimmed row + blocked icon; HITL badge), once `ft-cli`'s marker parsing lands\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/graph-panel.md", "text": "---\nname: graph-panel\nstatus: done\nparent: vscode-extension\ntests: npm test\nlast_verified: 2026-10-28\n---\n# graph-panel\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe main visual surface of the extension: the whole plan drawn as a graph of cards, one card per node, joined to their parents by lines. Each card is coloured by its status (planned, in progress, done) and shows a progress percentage next to the status control. The panel opens beside the code, follows the plan folder live, and lets a person read and edit the plan without leaving the editor.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (shared suite; relevant tests: \"renders one card per node...\", \"feature chip navigates...\", \"empty state...\", \"citations: external links...\", \"abstract read view renders...\", \"card shows progress rollup badge...\").\n\n## Todos\n\n## Questions\n\n## Implemented\n- Input: every markdown node under the plan folder. Files without a status in their header, and the schema file, are ignored. Children are attached to the parent named in each node's header.\n- Layout: one card per node. Cards can be expanded to show their abstract and collapsed to save space; toolbar buttons expand all, collapse all, and fit the whole graph into view. The first load fits automatically. Fitting never zooms in past natural size and never below a readable minimum.\n- Navigation: dragging empty space pans; the wheel zooms around the cursor between a low and a high limit. Dragging on a card does not pan.\n- Selection: clicking a card opens a drawer with all sections, with chips that jump to related nodes. A legend in the toolbar counts nodes per status. Status can be changed directly on the card.\n- Progress badge: the percentage is the share of done todos across the node and all its descendants. It is hidden when the subtree has no todos.\n- Floating box: a toggle in the toolbar opens the tree-wide todo and question box.\n- Paused banner: when a human has paused agent work, a banner says so and by whom.\n- Empty state: with no nodes, a prompt invites opening the plan folder.\n- Updates: the panel reloads whenever any plan file is created, changed or deleted. The drawer is not rebuilt while the person is typing in it.\n- Opening a node's full page launches the single-node editor. Links to files open inside the workspace only; links outside it are refused with a warning. Web links open externally.\n\n## Facts & Details\n- Decision: one panel at a time; invoking it again reveals the existing one.\n- Decision: the progress badge counts descendants so a branch shows how far its whole subtree has come, which a branch's own todos could not tell.\n- Writes go through the editor's own document so open tabs stay in sync and undo works.\n- The panel is reachable from a status bar button and a sidebar welcome button, and only activates in workspaces that contain the plan.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/node-editor.md", "text": "---\nname: node-editor\nstatus: done\nparent: vscode-extension\ntests: node --test --test-name-pattern \"node-editor\" out/test/graph.test.js\nlast_verified: 2026-10-28\n---\n# node-editor\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA custom editor that opens a single plan node as its own editor tab, showing the same section cards as the graph drawer instead of raw markdown. It stays in sync with the underlying document, so edits made by a person, an agent or another tool appear immediately. It is purely a viewer and editor; it has no way to launch agents.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` (after `tsc -p .`), then `node --test --test-name-pattern \"node-editor\" out/test/graph.test.js` passes (3 tests, all titled `node-editor mode: ...`).\n\n## Todos\n\n## Questions\n- [~] Q1: Should the custom node-editor tab replace plain markdown as the default for files under `features/`, or stay opt-in?\n  - O: Keep opt-in (current \u2014 `priority: \"option\"` in `customEditors`, opened explicitly via \"Open With\" or from the graph panel)\n  - O: Make it the default editor for `features/**/*.md` except `SCHEMA.md`\n  - A (agent): assumed default 'Keep opt-in (current \u2014 `priority: \"option\"` in `customEditors`, opened explicitly via \"Open With\" or from the graph panel)' while unattended; unconfirmed, reopen to change\n\n## Implemented\n- Opening: the editor is opt-in. A person picks it explicitly from the open-with choice on a plan file, or reaches it from a card in the graph panel. Plain markdown stays the default.\n- Display: the graph chrome (toolbar, canvas, floating box) is hidden so the single node fills the tab. The node is identified by its path relative to the plan folder, or just its file name if the file lies outside it.\n- Live sync: whenever the document changes, for any reason, the full text is pushed to the page and redrawn. The drawer is not rebuilt while a field has focus, so typing is not interrupted.\n- Writing: a change in the page replaces the whole document text and saves it. Identical text is ignored, which prevents echo loops. Because the write goes through the editor's document, undo works.\n- Raw view: a control reopens the same file in the plain text editor in the same tab group.\n- Links: a relative link in a section opens the target if it exists inside the workspace; otherwise a warning is shown.\n- Decision, assumed by the agent while unattended and unconfirmed: the editor stays opt-in rather than replacing plain markdown for plan files. Reopen the question to change it.\n\n## Facts & Details\n- Why opt-in: replacing the default editor would surprise people who just want to edit text or diff in version control,.\n- Messages exchanged with the editor host are deliberately few: ready, write, raw view, open link and open web address. No message can start a process.\n- Data kept: none of its own; the document is the only state.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) decide whether the `featureTree.node` custom editor should become the *default* editor for `features/**/*.md` (minus `SCHEMA.md`), or stay opt-in via right-click \"Open With\" as it is now\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/vscode-extension.md", "text": "---\nname: vscode-extension\nstatus: planned\nparent: feature-tree\ntests: npm test\nlast_verified: 2026-10-28\n---\n# vscode-extension\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA VS Code extension giving the tree a visual home instead of raw markdown, with three surfaces: [[graph-panel]], [[node-editor]] and [[drawer-widgets]]. All three share one bundle of tree-parsing, graph-drawing and styling code, switched between modes by the host that embeds it, so the parser and renderer logic is written once and tested once. The extension lives in its own folder in the repository.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (`tsc -p .` then `node --test out/test/*.test.js`; 45 tests, aggregate across all 3 children).\n\n## Todos\n- [ ] (P2) verify the extension in a real, live VS Code window (installed via the `~/.vscode/extensions` symlink) \u2014 so far only exercised through jsdom-simulated `node --test` runs, never an actual Extension Host; applies across all 3 surfaces equally {hitl}\n\n## Questions\n\n## Implemented\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n- [[drawer-widgets]] (done)\n- [[graph-panel]] (done)\n- [[node-editor]] (done)\n"}];</script><script>// Shared parse + minimal-diff edit helpers for feature nodes. Used by viewer (VS Code and browser) and tests.
// Rules live in features/SCHEMA.md. Priority: 0-3, or null for unassigned "(P?)".
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.FT = factory();
})(typeof self !== "undefined" ? self : this, function () {
  const SECTIONS = ["Abstract", "Acceptance Tests", "Todos", "Questions", "Implemented", "Facts & Details", "Citations", "Archived", "Children"];
  const TODO_RE = /^- \[( |~|x)\] \(P([0-3?])\) (.+)$/;
  const WIKI_RE = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]+)?\]\]/g;
  // matches both external (https?://…) and relative-path markdown links, e.g. [SKILL.md](../../skill/SKILL.md)
  const EXT_RE = /\[([^\]]+)\]\(([^)\s]+)\)/g;
  const MARK_RE = /\s*\{(blocked-by|blocked|limit|tle|hitl)(?::\s*([^}]+))?\}\s*$/;
