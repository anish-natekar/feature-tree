<!doctype html><html><head><meta charset="utf-8"><title>Feature Tree</title><style>:root {
  --done: #2e9e5b;
  --progress: #e0a020;
  --planned: #5a7fd6;
  --unknown: #888;
  --link: #3fb8b0; /* feature links: stay in viewer */
  --ext: #e07a3f; /* external urls: open browser */
}
body { margin: 0; overflow: hidden; font-family: var(--vscode-font-family, sans-serif); color: var(--vscode-foreground, #ddd); background: var(--vscode-editor-background, #1e1e1e); }
#toolbar { position: fixed; top: 8px; left: 8px; flex-wrap: wrap; max-width: calc(100vw - 32px); box-sizing: border-box; z-index: 10; display: flex; gap: 12px; align-items: center; padding: 6px 10px; border-radius: 6px; background: var(--vscode-editorWidget-background, #252526); border: 1px solid var(--vscode-editorWidget-border, #444); font-size: 12px; }
#toolbar .pausedbanner { color: var(--progress, #d29922); font-weight: 600; }
#toolbar .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
#toolbar button { cursor: pointer; background: transparent; color: inherit; border: 1px solid var(--vscode-editorWidget-border, #555); border-radius: 4px; padding: 2px 8px; }
#viewport { position: absolute; inset: 0; cursor: grab; }
#viewport.drag { cursor: grabbing; }
#canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
#edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
#edges path { fill: none; stroke: var(--vscode-editorWidget-border, #666); stroke-width: 1.5; }
.card { position: absolute; width: 240px; box-sizing: border-box; border-radius: 8px; border-left: 6px solid var(--c); background: var(--vscode-editorWidget-background, #252526); box-shadow: 0 1px 4px rgba(0,0,0,.4); font-size: 12px; overflow: hidden; }
.card[data-status="done"] { --c: var(--done); }
.card[data-status="in-progress"] { --c: var(--progress); }
.card[data-status="planned"] { --c: var(--planned); }
.card[data-status="unknown"] { --c: var(--unknown); }
.head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; height: 40px; box-sizing: border-box; }
.title { flex: 1; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title:hover { text-decoration: underline; }
.badge { padding: 1px 6px; border-radius: 10px; background: var(--c); color: #111; font-size: 10px; white-space: nowrap; }
/* status pill doubles as a select: no native chrome, so it still reads as a plain badge until clicked */
select.statussel { border: none; appearance: none; -webkit-appearance: none; font: inherit; cursor: pointer; }
select.statussel:hover { filter: brightness(1.15); }
.btn { cursor: pointer; user-select: none; opacity: .8; padding: 0 3px; }
.btn:hover { opacity: 1; }
.detail { padding: 0 10px 8px 10px; line-height: 1.4; }
.detail .abs { max-height: 64px; overflow: hidden; opacity: .85; margin-bottom: 6px; }
.detail .row { opacity: .8; }
.pri { display: inline-block; margin-right: 6px; }
.pri b { color: var(--progress); }

.ref { display: inline-block; padding: 0 6px; border-radius: 10px; background: color-mix(in srgb, var(--link) 25%, transparent); color: var(--link); border: 1px solid var(--link); cursor: pointer; margin: 0 2px; }
.ref:hover { background: var(--link); color: #111; }
.ref.missing { --link: #d65a5a; border-style: dashed; cursor: default; }
.ext { color: var(--ext); text-decoration: underline dotted; cursor: pointer; margin: 0 2px; }
.ext::after { content: " ↗"; }
.ext:hover { text-decoration: underline; }
.links { margin-top: 4px; }
.card.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--link); } 100% { box-shadow: 0 1px 4px rgba(0,0,0,.4); } }

.card.selected { outline: 2px solid var(--link); }
.unset { padding: 1px 6px; border-radius: 10px; border: 1px dashed var(--progress); color: var(--progress); font-size: 10px; white-space: nowrap; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 95vw; overflow-y: auto; box-sizing: border-box; padding: 12px 14px 40px; z-index: 20; background: var(--vscode-sideBar-background, var(--vscode-editorWidget-background, #252526)); border-left: 1px solid var(--vscode-editorWidget-border, #444); font-size: 12px; }
.drawer[hidden] { display: none; }
.dhead { display: flex; align-items: center; gap: 8px; }
.dtitle { flex: 1; font-size: 15px; font-weight: 700; }
.drawer .link { color: var(--link); cursor: pointer; font-size: 11px; text-decoration: underline; }
.sdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.sdot[data-status="done"] { background: var(--done); }
.sdot[data-status="in-progress"] { background: var(--progress); }
.sdot[data-status="planned"] { background: var(--planned); }
.sdot[data-status="unknown"] { background: var(--unknown); }
.muted { opacity: .6; font-size: 11px; word-break: break-all; }
/* quiet byline under the title: status/tests/verified/raw-link as flowing text, not a boxed metadata panel */
.byline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0 10px; font-size: 11px; opacity: .8; }
.byline .bsep { opacity: .5; }
.byline select.bstatus { border: none; background: transparent; appearance: none; -webkit-appearance: none; font: inherit; font-weight: 600; padding: 0; width: auto; cursor: pointer; }
.byline select.bstatus[data-status="done"] { color: var(--done); }
.byline select.bstatus[data-status="in-progress"] { color: var(--progress); }
.byline select.bstatus[data-status="planned"] { color: var(--planned); }
.drawer .byline input.testsinp { border: none; background: transparent; padding: 0; width: auto; flex: 1 1 auto; min-width: 60px; font: inherit; opacity: .9; }
.drawer .byline input.testsinp:focus { outline: none; border-bottom: 1px solid var(--vscode-input-border, #555); }
/* read view by default: rendered prose, click to edit. a quiet hover tint hints it's editable, not a bordered box */
.secview { padding: 5px 2px; border: none; border-radius: 4px; cursor: text; line-height: 1.5; }
.secview:hover { background: rgba(127,127,127,.06); }
.secview .empty { opacity: .5; font-style: italic; }
.secview ul { margin: 2px 0 2px 18px; padding: 0; }
.secview .p { margin: 0 0 6px; }
.secview .p:last-child { margin-bottom: 0; }
.secview[hidden], textarea[hidden] { display: none; }
.secview code, .atdesc code, .abs code, .ttext code, .qmeta code { background: rgba(127,127,127,.18); border-radius: 3px; padding: 0 4px; font-family: var(--vscode-editor-font-family, monospace); font-size: .95em; }
.secview strong { font-weight: 600; }
.secview em { font-style: italic; }
.testpill { display: inline-block; margin-right: 8px; color: var(--link); font-weight: 600; font-size: 11px; cursor: pointer; }
.testpill:hover { text-decoration: underline; }
.atdesc { opacity: .85; }
.drawer button { cursor: pointer; background: transparent; color: var(--link); border: none; padding: 3px 4px; font-size: 11px; font-weight: 600; }
.drawer button:hover { text-decoration: underline; }
.drawer .field { margin-top: 10px; }
.drawer .field > label { display: block; font-size: 11px; opacity: .7; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
.drawer .afield { margin-top: 10px; }
.drawer .afield > summary { cursor: pointer; font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; list-style: none; }
.drawer .afield > summary::-webkit-details-marker { display: none; }
.drawer .afield > summary::before { content: "▸ "; }
.drawer .afield[open] > summary::before { content: "▾ "; }
.drawer .afield > summary > label { display: inline; }
.drawer .afield textarea { margin-top: 5px; }
.drawer textarea, .drawer input:not([type=checkbox]), .drawer select { width: 100%; box-sizing: border-box; font: inherit; color: var(--vscode-input-foreground, inherit); background: var(--vscode-input-background, #1e1e1e); border: 1px solid var(--vscode-input-border, #555); border-radius: 4px; padding: 4px 6px; }
.drawer input[type=radio] { width: auto; flex: none; border: none; background: none; padding: 0; border-radius: 0; }
.drawer textarea { resize: vertical; }
.todo { margin-bottom: 4px; }
.todo.done .txt { text-decoration: line-through; opacity: .6; }
.todo.progress .txt { opacity: .85; }
.drawer .todo .txt { flex: 1 1 100px; min-width: 70px; border: none; background: transparent; padding: 2px 0; border-radius: 0; }
.drawer .todo .txt:focus { outline: none; border-bottom: 1px solid var(--vscode-input-border, #555); }
/* a todo row is a <details>: summary (or the plain add-row) is the only thing visible by default —
   priority/limit/blocked-on live in .tdetail, revealed by expanding, so the list reads as titles, not a form */
.todo > summary, .todo.add { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.todo > summary { cursor: pointer; list-style: none; }
.todo > summary::-webkit-details-marker { display: none; }
.todo > summary::before { content: "▸"; opacity: .5; flex: none; font-size: 10px; }
.todo[open] > summary::before { content: "▾"; }
.tdetail { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0 2px 20px; }
/* select, not a button: human picks the state directly instead of cycling blindly through it */
select.tstate { flex: none; width: 26px; height: 20px; padding: 0 1px; border: none; background: transparent; cursor: pointer; font-size: 13px; appearance: none; -webkit-appearance: none; }
select.tstate[data-tstate=" "] { color: var(--planned); }
select.tstate[data-tstate="~"] { color: var(--progress); }
select.tstate[data-tstate="x"] { color: var(--done); }
.todo select.pr { padding: 2px 2px; flex: none; width: 50px; border: none; border-bottom: 1px solid currentColor; border-radius: 0; background: transparent; }
/* same priority palette as the floating todo list's .pN badges, so color means the same thing everywhere */
.todo select.pr[data-pri="0"] { color: #d65a5a; }
.todo select.pr[data-pri="1"] { color: #e07a3f; }
.todo select.pr[data-pri="2"] { color: #5a7fd6; }
.todo select.pr[data-pri="3"] { color: #888; }
.todo select.pr[data-pri="?"] { color: #e0a020; border-bottom-style: dashed; }
.todo .cbspace { flex: none; width: 26px; }
.todo .btn.del { flex: none; }
.todo.add { margin-top: 6px; }
.ac { position: fixed; z-index: 100; min-width: 160px; max-height: 200px; overflow-y: auto; background: var(--vscode-editorSuggestWidget-background, #252526); border: 1px solid var(--link); border-radius: 4px; font-size: 12px; }
.ac-item { padding: 3px 8px; cursor: pointer; }
.ac-item.sel, .ac-item:hover { background: var(--link); color: #111; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 200; padding: 8px 14px; border-radius: 6px; background: var(--vscode-editorWidget-background, #333); border: 1px solid var(--link); font-size: 12px; }

.todobox { position: fixed; left: 16px; bottom: 16px; width: 380px; max-width: 70vw; max-height: 55vh; display: flex; flex-direction: column; z-index: 15; border-radius: 8px; font-size: 12px; background: var(--vscode-editorWidget-background, #252526); border: 1px solid var(--vscode-editorWidget-border, #444); box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.todobox[hidden] { display: none; }
.thead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: move; border-bottom: 1px solid var(--vscode-editorWidget-border, #444); }
.thead b { flex: 0 0 auto; }
.tcount { flex: 1; opacity: .6; }
.tfilters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--vscode-editorWidget-border, #444); }
.tfilters select, .tfilters input:not([type=checkbox]) { font: inherit; color: var(--vscode-input-foreground, inherit); background: var(--vscode-input-background, #1e1e1e); border: 1px solid var(--vscode-input-border, #555); border-radius: 4px; padding: 2px 4px; min-width: 0; flex: 1 1 100px; }
.chips { display: flex; gap: 4px; }
.chip { cursor: pointer; user-select: none; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--cc, #888); opacity: .45; }
.chip.on { opacity: 1; background: var(--cc, #888); color: #111; }
.dl { display: flex; align-items: center; gap: 2px; opacity: .8; }
.tlist { overflow-y: auto; padding: 4px 6px 8px; }
.trow { display: grid; grid-template-columns: 26px 28px 1fr auto; gap: 6px; align-items: baseline; padding: 3px 4px; border-radius: 4px; }
.trow:hover { background: rgba(127,127,127,.15); }
.trow.done .ttext { text-decoration: line-through; opacity: .6; }
.trow.progress .ttext { opacity: .85; }
.ttext { cursor: pointer; }
.twhere { cursor: pointer; color: var(--link); font-size: 11px; white-space: nowrap; }
.twhere:hover { text-decoration: underline; }
.pbadge { text-align: center; padding: 0 4px; border-radius: 8px; font-size: 10px; background: var(--cc, #888); color: #111; }
.empty { opacity: .6; padding: 8px; }
.p0 { --cc: #d65a5a; } .p1 { --cc: #e07a3f; } .p2 { --cc: #5a7fd6; } .p3 { --cc: #888; } .p\? { --cc: #e0a020; }
.pbadge.p\? { background: transparent; border: 1px dashed var(--cc); color: var(--cc); }
/* the drawer's own todo list reads as a page, not a wall of priority pills — the floating cross-tree list above keeps its pills */
.drawer .pbadge { background: none; border: none; color: var(--cc, inherit); font-weight: 700; padding: 0; border-radius: 0; }
.drawer .pbadge.p\? { border: none; }

.emptymsg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 420px; text-align: center; line-height: 1.5; opacity: .75; font-size: 14px; }
.emptymsg[hidden] { display: none; }
#toolbar button.primary { background: var(--link); color: #111; border-color: var(--link); }

.todo select.blk { padding: 2px 0; flex: none; max-width: 140px; border: none; border-bottom: 1px solid var(--progress); border-radius: 0; background: transparent; color: var(--progress); }
.qbadge { padding: 1px 6px; border-radius: 10px; border: 1px solid var(--link); color: var(--link); font-size: 10px; white-space: nowrap; }
/* question cards read as a doc page: a hairline divider between questions, not a bordered card per question */
.q { border: none; border-top: 1px solid var(--vscode-editorWidget-border, #444); padding: 8px 0 2px; margin-bottom: 0; }
.q:first-child { border-top: none; padding-top: 0; }
.q.pend { border-top-color: var(--link); }
.q.done { border-top-color: var(--done); }
.q textarea, .q input:not([type=radio]) { border: none; background: transparent; padding: 2px 0; border-radius: 0; }
.q textarea:focus, .q input:not([type=radio]):focus { outline: none; border-bottom: 1px solid var(--vscode-input-border, #555); }
.qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.qid { font-weight: 700; color: var(--progress); }
.q.pend .qid { color: var(--link); } .q.done .qid { color: var(--done); }
.qstate { flex: 1; opacity: .7; font-size: 11px; }
.qbtns { display: flex; gap: 6px; margin-top: 4px; }
.q .ans { margin-top: 4px; }
.q .opts { margin-top: 4px; font-size: 11px; opacity: .8; }
.mc { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.mcopt { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
.mcopt.rec span:last-child { font-weight: 600; }
.mcopt.rec span:last-child::after { content: " ★ recommended"; font-weight: 400; opacity: .6; font-size: 10px; }
.mcopt.other { opacity: .7; font-style: italic; }
.mcother { margin-top: 6px; }
.thead .tab { cursor: pointer; opacity: .55; padding: 0 4px; border-bottom: 2px solid transparent; font-weight: 700; }
.thead .tab.on { opacity: 1; border-bottom-color: var(--link); }
.trow.blocked .ttext { opacity: .7; }
.blk-tag { color: var(--progress); font-size: 11px; }
.hitl-tag { font-size: 11px; }
.hitl-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
.pctbadge { padding: 1px 6px; border-radius: 10px; border: 1px solid var(--done); color: var(--done); font-size: 10px; white-space: nowrap; }
.qrow { padding: 5px 6px; border-left: 3px solid var(--progress); margin: 4px 0; border-radius: 3px; background: rgba(127,127,127,.08); }
.qrow.pend { border-left-color: var(--link); } .qrow.done { border-left-color: var(--done); opacity: .75; }
.qline { display: flex; gap: 6px; align-items: baseline; }
.qline .ttext { flex: 1; }
.qmeta { font-size: 11px; opacity: .75; margin-top: 2px; }
.qrow input { width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; color: var(--vscode-input-foreground, inherit); background: var(--vscode-input-background, #1e1e1e); border: 1px solid var(--vscode-input-border, #555); border-radius: 4px; padding: 2px 6px; }
.qrow button { margin-top: 4px; cursor: pointer; background: transparent; color: inherit; border: 1px solid var(--link); border-radius: 4px; padding: 2px 8px; font-size: 11px; }
.chip.qo { --cc: #e0a020; } .chip.qp { --cc: #3fb8b0; } .chip.qd { --cc: #2e9e5b; }
/* a quiet in-page outline, not a repeat of the headings right below it — plain text, no pills */
.jump { margin: 2px 0 12px; font-size: 11px; }
.jump .chip { cursor: pointer; padding: 0; border-radius: 0; background: none; color: inherit; opacity: .65; }
.jump .chip:hover { opacity: 1; text-decoration: underline; }
.jump .chip:not(:last-child)::after { content: " · "; opacity: .6; }
.limwrap { display: inline-flex; align-items: center; flex: none; border: none; background: transparent; }
.limwrap .ico { padding: 0 2px; opacity: .6; font-size: 10px; }
.drawer .todo .lim { width: 42px; font-size: 11px; border: none; border-bottom: 1px solid transparent; border-radius: 0; padding: 2px 0; background: transparent; }
.drawer .todo .lim:focus { outline: none; border-bottom-color: var(--vscode-input-border, #555); }
.todo .btn.tle { flex: 0 0 100%; margin-top: 2px; }
.btn.tle { color: var(--progress); white-space: nowrap; }
.drawer .grip { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; z-index: 2; }
.drawer .grip:hover { background: var(--link); opacity: .5; }
.drawer.page { font-size: 14px; line-height: 1.55; }
.drawer.page textarea { font-size: 14px; }

/* Custom-editor tab for one node: the drawer IS the page, no graph chrome. */
body.node-editor { overflow: auto; }
body.node-editor #toolbar, body.node-editor #viewport, body.node-editor .todobox { display: none; }
body.node-editor .drawer { position: static; width: 100% !important; max-width: none !important; height: auto; min-height: 100vh; border-left: none; box-shadow: none; padding: 16px 24px 60px; font-size: 13px; }
body.node-editor .drawer .grip { display: none; }
body.node-editor .dhead > .btn:last-child { display: none; } /* "✕ Close" makes no sense when the drawer is the whole tab */
.todobox [hidden] { display: none !important; }
</style></head><body><div id="toolbar"></div><div id="viewport"><div id="canvas"><svg id="edges"></svg></div></div><script>window.FT_SNAPSHOT=[{"path": "SCHEMA.md", "text": "# Feature Tree Schema\n\nSource of truth for node format. `ft lint` enforces it. Obsidian-compatible: YAML frontmatter + `[[wikilinks]]`.\n\n## Design Philosophy\n\nFeature tree is a **project status indicator**, not an IDE or a spec-document system. Researched against Matt Pocock's Wayfinder skill, GitHub Spec Kit, and AWS Kiro before writing this down, specifically to reject the parts of those tools that don't fit:\n\n- **A meta-level map, one step above the code.** Agents now write more code than a human can review line by line; what a human can still review and steer is intent, decisions, facts and capabilities. The tree is that map: every feature/capability the project consists of, why it exists, what was decided and why, what is known (and from where), and what still needs a human. It is built by searching and mapping decisions as the project is made, and it grows with the project, updated by the same agents that change the code. A reader should understand the whole project and each feature's reasoning without opening a source file.\n- **Natural language, not implementation detail.** A node captures intent, decisions, and rationale in prose a human can skim in seconds \u2014 not schemas, interfaces, or code. Implementation detail lives in the actual code, which is the source of truth for *how*; a node only needs to say *what* and *why*.\n- **One file per node, never fragmented.** Spec Kit and Kiro each split a feature across 3 files (spec/plan/tasks, or requirements/design/tasks). Feature tree deliberately rejects that: one markdown file, one fixed set of sections, so there's exactly one place to look. Don't propose splitting a node into companion files \u2014 split into child *nodes* instead if it's genuinely grown too big (see Split guards).\n- **Fog of war: don't pre-decompose vague scope.** If a child node's scope isn't sharp enough to write a real Abstract yet, it isn't ready to be a node. Keep it as a loose Todo or Question on the *parent* instead, and only promote it once you can state what it is precisely. `ft lint` nudges at this with a warning when an Abstract is still a `ft init`-style `DRAFT:` placeholder \u2014 that's a sign the node was created before its scope was actually known.\n- **Acceptance Tests read better as testable statements** (`Given X, when Y, then Z`, or `WHEN <condition> THE SYSTEM SHALL <behavior>`) than as free prose \u2014 a style tip borrowed from Kiro's EARS convention, not an enforced rule. `ft lint` doesn't check phrasing.\n\n## Layout\n\n- Tree root dir: `features/`.\n- Node with children: `features/<name>/<name>.md`, children sit in same folder (`<child>.md` or `<child>/<child>.md`).\n- Leaf: plain `<name>.md`.\n- File stem == `name` in frontmatter. Names unique across tree (wikilinks rely on it), kebab-case.\n\n## Frontmatter\n\n| field | rule |\n|---|---|\n| `name` | kebab-case, equals file stem |\n| `status` | `planned` \\| `in-progress` \\| `done` |\n| `parent` | name of parent node, derived from path; empty for roots |\n| `tests` | runnable command or test file path. Manual fallback: `manual` + checklist in Acceptance Tests |\n| `last_verified` | `YYYY-MM-DD` or empty; set when tests last passed |\n\n## Sections (fixed order, `##` headings)\n\n1. **Abstract**: what the feature is, why it is needed (intent).\n2. **Acceptance Tests**: tests that, when passing, mean feature implemented. Command or path, plus short description. Manual checklist allowed if `tests: manual`.\n3. **Todos**: `- [ ] (P1) text`. Priority P0 (urgent) to P3 (nice-to-have), or `P?` = unassigned: the human logged an issue without ranking it and the agent infers the priority (`ft todos --unassigned`), then rewrites the line. 3-state checkbox, same as Questions: `[ ]` not started, `[~]` in progress, `[x]` completed.\n4. **Questions**: open questions the agent could not settle alone, so the human can answer later or the agent can research them. Format below.\n5. **Implemented**: documentation of what exists. Reflect moves a confirmed `[x]` todo's prose here (see Reflect below), then removes it from Todos.\n6. **Facts & Details**: prose distilled from confirmed (`[x]`) questions \u2014 facts, decisions, constraints that came out of asking something. Reflect writes here, never todos.\n7. **Citations**: links to web pages, papers, docs. Supports claims made in either Implemented or Facts & Details.\n8. **Archived**: verbatim raw record of completed todo lines and confirmed question blocks, collapsed by default in the viewer. Written only by `ft reflect`; never hand-edit.\n9. **Children**: auto-generated by `ft index` as wikilinks.\n\n## Questions and blocked todos\n\n```\n- [ ] Q1: Which planner library fits a 6-DOF arm on a Pi?\n  - O: OMPL\n  - O: Custom RRT\n- [~] Q2: What rating does the power supply need?\n  - A (agent): 24 V 10 A. Sources: [datasheet](https://example.com)\n- [x] Q3: Which serial protocol?\n  - A: Modbus RTU.\n```\n- `[ ]` open \u00b7 `[~]` answered by the agent after research, human should confirm \u00b7 `[x]` answered by the human (or confirmed).\n- IDs `Q1`, `Q2`\u2026 are unique within the node, never reused. One-line answers.\n- A todo blocked on a question ends with `{blocked: Q1}` (same node). It counts as blocked only while that question is `[ ]`; `[~]` and `[x]` unblock it. Remove the marker once the question is answered.\n- A `done` node must have no open (`[ ]`) questions.\n- Questions are asked to the human with node path + id, e.g. `features/robot-arm/motion-planning.md Q1`.\n- Todos use the same three states: `[ ]` not started \u00b7 `[~]` in progress \u00b7 `[x]` completed, awaiting Reflect. `ft next` prefers an in-progress todo over a not-started one regardless of priority (finish what's started).\n\n## Reflect\n\nCompleting a todo or confirming a question doesn't delete it immediately \u2014 it just flips the checkbox to `[x]`. A separate **Reflect** stage archives and distills confirmed items in bulk, later:\n\n- `ft reflect --check [--under NODE]` \u2014 lists every confirmed `[x]` todo/question not yet archived; exit 1 if any exist. The Stop hook runs this automatically and blocks the turn until it's clean.\n- `ft reflect <node> --todo \"<exact text>\" --note \"<prose>\"` \u2014 moves that todo's raw line verbatim into Archived, removes it from Todos, appends the note to Implemented.\n- `ft reflect <node> --question Qn --note \"<prose>\"` \u2014 moves the question's full block verbatim into Archived, removes it from Questions, appends the note to Facts & Details.\n- Plan mode requires `ft reflect --check` to pass before starting a new plan \u2014 Reflect first, then plan.\n\n### Multiple-choice questions\n\nSame convention as the `AskUserQuestion` tool: offer a short list of concrete options instead of an open-ended question when there is one.\n\n- `- O: <option>` lines go directly under the question line, before any `- A:` line. Add with `ft ask <node> \"text\" --option \"OMPL\" --option \"Custom RRT\"`.\n- The **first** `O:` line is the recommended option. The viewer badges it \"Recommended\" and pre-highlights it \u2014 don't write the word \"Recommended\" into the text yourself.\n- Never write an \"Other\" option by hand. The viewer and the agent always add it implicitly as the last choice, revealing a free-text box when picked.\n- The answer line (`- A: ...`) is unchanged whether the human picked a listed option or typed something under \"Other\".\n- Plain open-ended questions (no `O:` lines) still work exactly as before \u2014 options are optional.\n\n## Cross-branch dependencies and unattended work\n\nTree position (parent/child) governs *organization*; it doesn't have to govern *sequencing*. A todo can be gated on a completely different branch of the tree, and a todo can be marked as needing a live human regardless of where it sits. Both researched from Matt Pocock's Wayfinder skill, adapted to this tool's node-granularity (todos have no stable id, so blocking targets a *node*, reusing the node status the tree already tracks).\n\n- `{blocked-by: node-name}` \u2014 this todo is excluded from `ft next`/`ft todos --ready` until `node-name`'s own `status` is `done`, no matter where that node sits in the tree. `ft todos` shows it with a `\u26d4 blocked by node-name` suffix instead of hiding it. `ft lint` warns if `node-name` doesn't exist.\n- `{hitl}` \u2014 this todo needs a live human (a decision only they can make, not something an agent should resolve alone). No marker = AFK-doable by an agent, the common case. `ft next --afk-only` / `ft todos --afk-only` filter `{hitl}` todos out \u2014 the call an unattended or looped work session makes instead of the plain form.\n\n## Progress\n\n`ft tree` shows a rollup percentage next to each node: `done / total` todos summed across that node and every descendant. A node with no todos anywhere in its subtree shows no percentage (not `0%`, since there's nothing to track, not nothing done). Purely derived from existing checkboxes \u2014 no extra frontmatter.\n\n## Time limits and TLE\n\n- Todo markers go at the end of the line, in any order: `{blocked: Q1}` `{blocked-by: node-name}` `{limit: 20m}` `{tle: 20m}` `{hitl}`.\n- `{limit: 90s|20m|2h}` overrides the default per-todo time budget for the headless driver (`ft work --task-limit`, default 20m).\n- `{tle: 20m}` is written by `ft work` when the agent ran out of time on that todo (Time Limit Exceeded): the process is killed, the todo is skipped by `ft next`, and `ft lint` warns. A human or planner then splits the todo or raises `{limit}` and removes `{tle}` (viewer: click the TLE chip).\n\n## Section index\n\nEvery node has one line under its title: `Jump: [Abstract](#abstract) \u00b7 \u2026`. `ft new` writes it, `ft index` repairs it, `ft lint` warns when missing. Do not edit it by hand. The viewer shows the same sections as jump chips.\n\n## Split guards (lint warnings)\n\n- Body over 600 words, over 12 open todos, over 8 children, or depth over 5 \u2192 split or regroup. `ft work` runs one split step per oversized node before doing todos.\n\n## Links\n\n- Feature link: `[[node-name]]` or `[[node-name|label]]`, anywhere in the body. Use instead of re-explaining another feature. Must name an existing node (lint error otherwise). Viewer shows teal chips; click navigates inside the viewer.\n- External link: plain markdown `[text](https://...)`. Viewer shows orange links with \u2197; click opens the browser. Put sources in `## Citations`; inline use is fine too.\n- Feature links in `## Children` are auto-generated and not counted as references.\n\n## Editing\n\n- Humans edit by hand, in the VS Code viewer drawer, or in the standalone `features/viewer.html` (`ft view`). All write the same markdown; edits change only the touched section.\n- Typing `[[` in any viewer field autocompletes node names.\n- Structural edits (CLI/skill only, no viewer buttons): `ft delete <name> [--subtree] [--yes]` (dry-run by default; without `--subtree`, direct children are reparented up to the deleted node's own parent), `ft rename <old> <new>` (updates children's `parent:` and every `[[old]]` wikilink tree-wide), `ft move <name> <new-parent|->` (relocates a node and its whole subtree). All three are filesystem operations \u2014 parent/child nesting is folder-derived, not just frontmatter.\n- `ft init [path]` bootstraps a rough-draft tree from an existing codebase (README + manifest + top-level dirs); refuses if `features/` is already non-empty. Follow up with the Plan-mode interview to refine the draft.\n\n## Rules\n\n- Body size: warn under 80 words, warn over 600, error over 900. Too big \u2192 split into children. Too small \u2192 merge into parent.\n- `done` requires: no unchecked todos, `tests` set, `last_verified` set.\n- `status` is computed, not hand-maintained: `ft index` sets it to `in-progress` if any todo is `[~]`; else `done` if there are zero open todos/questions and `tests`/`last_verified` are set; else `planned`. Hand-editing `status` is fine but `ft lint` warns if it drifts from the computed value \u2014 run `ft index` to resync.\n- Confirmed todo (`[x]`) left in Todos \u2192 lint warning (run `ft reflect`).\n- Questions to the human cite node path, e.g. `features/robot/arm/gripper.md`.\n"}, {"path": "feature-tree/autonomy/autonomy-in-ui.md", "text": "---\nname: autonomy-in-ui\nstatus: done\nparent: autonomy\ntests: cd vscode-feature-tree && npm test\nlast_verified: 2026-10-29\n---\n# autonomy-in-ui\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe VS Code panel and standalone viewer should surface the same briefing the CLI gives: a Needs-you list (open questions, assumptions to confirm, HITL todos) and a paused banner, so a human can inspect and steer without a terminal. The markdown stays the source of truth, so the viewer only presents what the command line already defines.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes with new tests for the needs-you view and paused banner.\n\n## Todos\n\n## Questions\n\n\n## Implemented\nThe viewer has a Needs-you view listing open and agent-decided questions (work-blocking ones first) and tasks only a human can do, with a count on its tab. A banner shows when work is paused. Filter controls that do not apply to the current view are hidden.\n\n## Facts & Details\n\n## Citations\n\n## Archived\n- [x] (P2) add a Needs-you tab to the floating box built from open/agent-answered questions and HITL todos\n- [x] (P3) show a paused banner when `.paused` exists (needs the host to expose it)\n\n## Children\n"}, {"path": "feature-tree/autonomy/autonomy.md", "text": "---\nname: autonomy\nstatus: done\nparent: feature-tree\ntests: python3 -m unittest skill.tests.test_ft.AutonomyTests\nlast_verified: 2026-10-29\n---\n# autonomy\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nGoal: make the tree a self-managing control plane. A human glances at one briefing to see progress and the few things only they can decide, then walks away; agents keep working through everything else without being around, and every decision they made alone stays visible, reviewable and reversible. The tree on disk is the only shared state: the human steers by answering questions, confirming agent assumptions, tagging work HITL, and pausing; the agent steers by `ft next --afk-only`, `ft assume` and `ft ask`. This node groups the capabilities that serve that loop; each child owns one piece.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.AutonomyTests` passes, and `ft status` on this repo prints a briefing whose NEEDS YOU list matches `ft questions --open`.\n\n## Todos\n\n## Questions\n\n\n## Implemented\nProven end to end with a real unattended agent run: it finished the work it could, researched a decision it was blocked on, flagged that decision for human confirmation, and left a briefing listing exactly what the human still owes. A pause stops the run cleanly.\n\n## Facts & Details\n\n## Citations\n\n## Archived\n- [x] (P2) run `ft work` unattended end to end on a throwaway sample tree and confirm it finishes, pauses on `ft pause`, and leaves a clean `ft status` handoff\n\n## Children\n- [[autonomy-in-ui]] (done)\n- [[away-digest]] (planned)\n- [[human-briefing]] (done)\n- [[kill-switch]] (done)\n- [[unattended-decisions]] (done)\n"}, {"path": "feature-tree/autonomy/away-digest.md", "text": "---\nname: away-digest\nstatus: done\nparent: autonomy\ntests: python3 -m unittest skill.tests.test_ft.DigestTests\nlast_verified: 2026-10-29\n---\n# away-digest\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nWhen a human comes back after agents worked alone, they should not have to read diffs to learn what happened. The digest answers one question: what changed in the plan since I last looked? It lists the work agents finished, the questions they raised, the decisions they made on their own and the nodes they added, drawn from the plan's own history, in plain language. It is read-only and complements the briefing, which says what is owed now, while the digest says what already happened.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.DigestTests` passes; on a repo with history, `ft digest --since 1.day` lists completed work, new questions, assumed decisions and new nodes, and prints a clear line when nothing changed.\n\n## Todos\n\n## Questions\n\n## Implemented\nA returning human can ask what changed in the plan since a given time and get a short list of finished work, questions raised, decisions agents made alone, and new nodes, read from the plan's own history.\nEvery fresh session now opens with the briefing followed by the recent-changes digest, and the skill tells agents to use the digest when resuming after time away.\n\n## Facts & Details\nThe digest is command-line only on purpose: the viewer reads plain files and has no access to version history, so showing it there would need a new bridge in both hosts for little gain over the briefing.\n\n## Citations\n\n## Archived\n- [x] (P1) `ft digest [--since WHEN]` summarizing finished todos, new questions, agent-assumed decisions and added nodes from git history of the plan\n- [x] (P2) mention the digest in the skill's resume step and in the session-start briefing hook\n\n## Children\n"}, {"path": "feature-tree/autonomy/human-briefing.md", "text": "---\nname: human-briefing\nstatus: done\nparent: autonomy\ntests: python3 -m unittest skill.tests.test_ft.AutonomyTests\nlast_verified: 2026-10-29\n---\n# human-briefing\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\n`ft status` is the one command a human runs to take control of an agent-built project. One screen: PROGRESS (todos done, nodes by status), NEEDS YOU (open questions ranked by how many todos they block with the agent's recommended option shown, agent-answered questions to confirm, HITL todos only a human can do, TLE todos to split, lint errors), and AGENT CAN DO ALONE (ready count plus the next autonomous pick). The goal is that nothing hides: if the agent is stuck or guessed, it is listed here, ranked by urgency.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.AutonomyTests` (status tests) passes.\n\n## Todos\n\n## Questions\n\n\n## Implemented\nA human can get one briefing of any project: how far along it is, what only they can decide, and what agents can do without them. Open questions that hold up work are listed first, with the option the agent would choose. New agent sessions start from that briefing instead of a raw tree dump.\n\n## Facts & Details\n\n## Citations\n\n## Archived\n- [x] (P1) `ft status` prints PROGRESS, NEEDS YOU, AGENT CAN DO ALONE and honours `--under`\n- [x] (P2) have the SessionStart hook print `ft status` instead of tree+next so every fresh session starts from the briefing\n\n## Children\n"}, {"path": "feature-tree/autonomy/kill-switch.md", "text": "---\nname: kill-switch\nstatus: done\nparent: autonomy\ntests: python3 -m unittest skill.tests.test_ft.AutonomyTests\nlast_verified: 2026-10-29\n---\n# kill-switch\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA human must be able to stop autonomous work instantly and without knowing process ids. `ft pause [reason]` writes `features/.paused`; `ft next` then prints PAUSED instead of a todo, so skill-driven sessions stop picking work, and `ft work` refuses to start another step (exit 5). `ft resume` clears it. The pause is a plain file so it also versions, shows in `ft status`, and can be set by hand or from another tool.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.AutonomyTests` (pause tests) passes.\n\n## Todos\n\n## Questions\n\n\n## Implemented\nA human can pause all unattended work with one command and resume it later. While paused, agents are told not to pick up work, the automatic runner refuses to start another step, and the end-of-turn checks stop nagging. The pause is visible in the briefing and in the viewer.\n\n## Facts & Details\n\n## Citations\n\n## Archived\n- [x] (P1) `ft pause`/`ft resume` gate `ft next` and `ft work`, and show in `ft status`\n- [x] (P3) make the Stop/PostToolUse hooks also respect `.paused`\n\n## Children\n"}, {"path": "feature-tree/autonomy/unattended-decisions.md", "text": "---\nname: unattended-decisions\nstatus: done\nparent: autonomy\ntests: python3 -m unittest skill.tests.test_ft.AutonomyTests\nlast_verified: 2026-10-29\n---\n# unattended-decisions\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nWhen an agent works without a human and a todo blocks on a question that has a recommended default, stalling wastes the whole run. `ft assume NODE Qn [--option N]` answers the question with the recommended option (or the Nth), marks it agent-answered `[~]` with an explicit unconfirmed note, and removes the `{blocked}` marker so work continues. The human reviews assumptions from `ft status` (they show under confirm) and can reopen any of them. Questions without options are never assumed: those need research or the human.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.AutonomyTests` (assume tests) passes.\n\n## Todos\n\n## Questions\n\n\n## Implemented\nAn agent working alone can answer a question that has a recommended default instead of stalling. The answer is recorded as an unconfirmed agent decision, work that waited on it resumes, and the human reviews or reverses it later. Rule of thumb: only safe, reversible choices may be assumed; irreversible, costly or security-relevant ones stay open for the human.\n\n## Facts & Details\n\n## Citations\n\n## Archived\n- [x] (P1) `ft assume` answers an optioned open question as `[~]`, unblocks its todos, refuses option-less or closed questions\n- [x] (P2) document in SKILL.md when an unattended agent may assume vs must leave a question for the human\n\n## Children\n"}, {"path": "feature-tree/claude-hooks.md", "text": "---\nname: claude-hooks\nstatus: done\nparent: feature-tree\ntests: python3 -m unittest skill.tests.test_ft.HookTests\nlast_verified: 2026-10-28\n---\n# claude-hooks\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nClaude Code hooks that keep an agent honest while it works on a feature-tree node, without relying on the agent remembering the rules. Three guards exist: one blocks any write that leaves a node invalid, one refuses to let the agent stop while finished work has not been reflected into the node (or a todo has no priority, or a node claims to be done while todos remain open), and one greets each new session with the current node's summary and its next todo. The same check for unreflected work powers both the stop guard and the reflect command, so the two never disagree.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.HookTests -v` passes (3 tests: lint-blocks-on-error, stop-hook-checkpoint, context-hook).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Write guard: after every edit under the features folder, the node is linted and the edit is blocked if the node is now invalid. Edits elsewhere are ignored.\n- Stop guard: refuses to end the turn while confirmed todos or questions are not yet archived, while any todo still lacks a priority, or while a node marked done has open todos. It tells the agent exactly which reflect command to run, and it steps aside on a repeated stop so it can never trap the agent in a loop.\n- Session context: at session start, shows the current node's highest-priority open todo.\nThe install steps are documented in a hooks README next to the hook script, not just in the skill file.\n\n## Facts & Details\n\n## Citations\n- [skill/SKILL.md](../../skill/SKILL.md)\n\n## Archived\n- [x] (P3) document the hook install steps (wiring `ft_hook.py` into `settings.json`) in a README, not just inline in `SKILL.md`\n\n## Children\n"}, {"path": "feature-tree/distribution.md", "text": "---\nname: distribution\nstatus: planned\nparent: feature-tree\ntests: manual\nlast_verified: 2026-10-28\n---\n# distribution\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nHow feature-tree reaches anyone besides its author: the public GitHub repository (the source of truth for the skill, the command line tool and the editor extension), and whatever path the VS Code extension takes to get installed elsewhere. Today that path is a developer-only local install copied into the user's VS Code extensions folder. It is a plain copy, not a link, so the extension's UI assets must be copied again after changes. There is no packaged installer file and no Marketplace listing yet.\n\n## Acceptance Tests\nmanual checklist: repo is public and cloneable; `README.md` and `LICENSE` exist at the repo root; `vsce package` produces an installable `.vsix` without error.\n\n## Todos\n- [ ] (P3) tag a `v0.1.0` release once the extension install story is settled {hitl}\n\n## Questions\n- [~] Q1: How should the VS Code extension reach a install?\n  - O: Keep it local/dev-only (current \u2014 symlinked into `~/.vscode/extensions/`, no publisher id needed)\n  - O: Package a `.vsix` and share it directly (no Marketplace, no publisher id)\n  - O: Register a publisher id and publish to the VS Code Marketplace\n  - A (agent): assumed default 'Keep it local/dev-only (current \u2014 symlinked into `~/.vscode/extensions/`, no publisher id needed)' while unattended; unconfirmed, reopen to change\n\n## Implemented\n- Public GitHub repository, with an MIT license and a README at the root, and an ignore file covering build output and dependencies.\n- Fixed packaging bugs that blocked real activation: the extension's entry point path was wrong, launch and build configs were added so the extension can be run with F5, and a permanent local install replaced the awkward multi-window development workflow. Because it is a copy, the UI assets must be re-copied after UI changes or the panel shows stale UI.\nDecision (agent-assumed, unconfirmed Q1): keep the extension local and developer-only, with no Marketplace publisher. Revisit by reopening Q1.\n\n## Facts & Details\n\n## Citations\n- [package.json](../../vscode-feature-tree/package.json)\n\n## Archived\n- [x] (P1) choose a real publisher id and decide whether to publish the extension to the VS Code Marketplace, vs. keeping it a local/dev-only install\n\n## Children\n"}, {"path": "feature-tree/feature-tree.md", "text": "---\nname: feature-tree\nstatus: done\nparent: \ntests: manual\nlast_verified: 2026-10-28\n---\n# feature-tree\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA hierarchical planning method delivered as a Claude skill plus a small command line tool: a tree of markdown nodes kept next to the code and versioned with it, used to plan and steer work without touching project code during planning. This root node exists to dogfood the method on itself. It describes feature-tree's own subsystems (the command line tool, the editor extension, the standalone viewer, the hooks and distribution) the same way it would describe any other project's features. There is no single build or test command for the whole project. Each child has its own acceptance test, and this node's own test is manual: lint and index run clean across the whole tree.\n\n## Acceptance Tests\nmanual: `python3 skill/scripts/ft.py lint` reports 0 errors across all nodes (including this subtree); `python3 skill/scripts/ft.py tree` shows all 5 children under `feature-tree`.\n\n## Todos\n\n## Questions\n\n## Implemented\n- Scaffolded this root and its children following the planning conventions in the skill, with real abstracts, tests, todos and notes on each node rather than placeholder text.\n- Wrote the Design Philosophy into the schema document: nodes hold natural-language intent and decisions only, never implementation detail; each node is one file and is never fragmented into separate spec, design and task files (an explicit rejection of GitHub Spec Kit and AWS Kiro's pattern); and vague scope is not decomposed into premature child nodes (fog of war). Writing acceptance tests as testable statements is noted as a style tip, not enforced.\nAll 13 flagged nodes rewritten in plain language; lint now enforces this altitude going forward.\n\n## Facts & Details\n\n## Citations\n- [SCHEMA.md](../SCHEMA.md)\n- [SKILL.md](../../skill/SKILL.md)\n\n## Archived\n- [x] (P2) write a `## Design Philosophy` section into `features/SCHEMA.md`: natural-language intent/decisions only (no implementation detail), one file per node never fragmented into separate spec/design/tasks files, and the fog-of-war rule (don't create a child node for scope that's still vague). Researched from Wayfinder, GitHub Spec Kit, and AWS Kiro.\n- [x] (P2) rewrite the nodes `ft lint` flags as \"reads like code docs\" so they state intent, decisions and facts in plain language, with commands kept only in Acceptance Tests\n\n## Children\n- [[autonomy]] (done)\n- [[claude-hooks]] (done)\n- [[distribution]] (planned)\n- [[ft-cli]] (done)\n- [[standalone-viewer]] (planned)\n- [[vscode-extension]] (planned)\n"}, {"path": "feature-tree/ft-cli/cross-branch-deps.md", "text": "---\nname: cross-branch-deps\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.DependencyTests\nlast_verified: 2026-10-28\n---\n# cross-branch-deps\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA way to say that one todo cannot start until a different node is done, no matter where either node sits in the tree. Inspired by Matt Pocock's Wayfinder, the blocked-by marker hides the todo from the list of next work until the target node reaches done status. A second marker flags todos only a human can do, and a flag on the next-work commands filters those out so unattended or looped agent runs never pick them up.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.DependencyTests -v` passes (4 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Blocked-by marker: the todo is excluded from the next-work frontier until the named node is done, regardless of tree position. The todo listing shows who it is blocked by, and lint warns when the named node does not exist.\n- Human-in-the-loop marker plus an away-from-keyboard filter: human-only todos are skipped on unattended or looped runs.\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P1) add `{blocked-by: node-name}` todo marker (cross-branch dependency gate, independent of tree position) with `ft next`/`ft todos` exclusion while the target node isn't `done`; `ft lint` warns on a dangling target\n- [x] (P1) add `{hitl}` todo marker plus `--afk-only` on `ft next`/`ft todos` to filter HITL-tagged todos out for unattended/looped work sessions\n\n## Children\n"}, {"path": "feature-tree/ft-cli/ft-cli.md", "text": "---\nname: ft-cli\nstatus: done\nparent: feature-tree\ntests: python3 -m unittest skill.tests.test_ft\nlast_verified: 2026-10-28\n---\n# ft-cli\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe `skill/scripts/ft.py` command-line driver: the single source of truth for parsing, linting, and mutating feature nodes. One parser/serializer every surface (VS Code extension, standalone viewer, a future agent) can trust instead of each re-implementing the schema. See the children below for each capability's own detail: [[schema]], [[work-loop]], [[questions]], [[cross-branch-deps]], [[progress-rollup]], [[reflect]], [[structural-editing]], [[init]].\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft -v` passes (38 tests, aggregate across all children's test classes).\n\n## Todos\n\n## Questions\n\n## Implemented\n\n## Facts & Details\n\n## Citations\n- [skill/SKILL.md](../../../skill/SKILL.md)\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n- [[cross-branch-deps]] (done)\n- [[init]] (done)\n- [[progress-rollup]] (done)\n- [[questions]] (done)\n- [[reflect]] (done)\n- [[schema]] (done)\n- [[structural-editing]] (done)\n- [[work-loop]] (planned)\n"}, {"path": "feature-tree/ft-cli/init.md", "text": "---\nname: init\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.InitTests\nlast_verified: 2026-10-28\n---\n# init\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nBootstraps a rough-draft tree from an existing codebase, using its README, manifest and top-level directories, so a project that predates feature-tree does not start from a blank page. It refuses to run when a features folder already has content, so it can never overwrite real planning. Each generated child gets a placeholder abstract marked as a draft, and lint warns while an abstract is still such a placeholder. That warning is a fog-of-war nudge: the node's scope has not actually been sharpened yet and should be written properly or dropped.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.InitTests -v` passes (2 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Init command that drafts a tree from an existing codebase and refuses if the features folder is already non-empty.\n- Lint warning when an abstract still starts with the draft marker left by init, nudging the author to sharpen the node's scope.\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P3) `ft lint`: warn when an Abstract is still a `DRAFT:` placeholder left over from `ft init`\n\n## Children\n"}, {"path": "feature-tree/ft-cli/progress-rollup.md", "text": "---\nname: progress-rollup\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.RollupTests\nlast_verified: 2026-10-28\n---\n# progress-rollup\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\n`rollup_progress()`: done/total todo count rolled up across a node and all its descendants, shown as `ft tree`'s `[NN%]` prefix. No badge when a subtree has no todos at all (avoids implying \"nothing done\" when there's simply nothing to track).\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.RollupTests -v` passes (1 test).\n\n## Todos\n\n## Questions\n\n## Implemented\n- `rollup_progress()`: done/total todos across a node + descendants, shown as `ft tree`'s `[NN%]`; no badge when a subtree has no todos.\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) add `rollup_progress()` (done/total todos across a node + its descendants) and show it in `ft tree` output\n\n## Children\n"}, {"path": "feature-tree/ft-cli/questions.md", "text": "---\nname: questions\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.QuestionOptionTests\nlast_verified: 2026-10-28\n---\n# questions\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nMultiple-choice questions: `ft ask <node> \"text\" --option \"...\" --option \"...\"` (repeatable), written as `- O:` sub-lines under the question. First option is CSS/display-flagged \"recommended\"; \"Other\" is always implicit and never hand-written to disk.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.QuestionOptionTests -v` passes (3 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Multiple-choice questions: `ft ask <node> \"text\" --option \"...\" --option \"...\"` (repeatable), written as `- O:` sub-lines under the question; first option = recommended, \"Other\" always implicit \u2014 never hand-written to disk.\nlint warns on single-option and duplicate-option questions; covered by LintBaseTests.\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P3) lint check for degenerate MCQ options (duplicate option text, or a question with only one `- O:` line)\n\n## Children\n"}, {"path": "feature-tree/ft-cli/reflect.md", "text": "---\nname: reflect\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.ReflectTests\nlast_verified: 2026-10-28\n---\n# reflect\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe archive-and-distill stage of the work cycle. When a todo or question is confirmed done, reflect moves it unchanged into the Archived section and distills a one-line prose note into Implemented (for todos) or Facts & Details (for questions), so the node's current state reads as a summary of what is true rather than a pile of finished checkboxes. A check mode reports anything confirmed but not yet reflected. The stop guard and the planning-mode gate both rely on that same check, so the two can never drift apart.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.ReflectTests -v` passes (5 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Reflect command: archives a confirmed todo or question verbatim and distills a note into Implemented or Facts & Details.\n- Check mode, shared with the stop guard and the planning-mode gate, listing confirmed items that still need reflecting.\n\n## Facts & Details\n\n## Citations\n- [skill/SKILL.md](../../../skill/SKILL.md)\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/ft-cli/schema.md", "text": "---\nname: schema\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.TodoStateTests\nlast_verified: 2026-10-28\n---\n# schema\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe node format itself: frontmatter plus nine sections in a fixed order (Abstract, Acceptance Tests, Todos, Questions, Implemented, Facts & Details, Citations, Archived, Children). The tool reads and writes nodes so that an unedited file comes back byte-for-byte identical, which keeps diffs clean. The foundational lint checks live here too: schema and section-order errors, size warnings above 600 words, a missing or stale jump line (fixable by re-indexing), and broken parent, child or wikilink references. Todos have three states (not started, in progress, done), mirroring the convention already used for questions.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.TodoStateTests -v` passes (2 tests: 3-state checkbox parse/format round-trip).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Node parser and serializer with the fixed section order and a byte-identical round-trip on unedited files.\n- Lint covering schema and section-order errors, oversize warnings, missing or stale jump lines, and broken parent, child and wikilink references.\n- Three-state todos; the next-work command prefers an in-progress todo over a higher-priority one not yet started.\n- A dedicated test class now exercises these base lint rules directly: clean pass, section order, short and oversize nodes, stale jump line, broken wikilink and missing parent.\n\n## Facts & Details\n\n## Citations\n- [skill/scripts/ft.py](../../../skill/scripts/ft.py)\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) add a dedicated test class for `ft lint`'s base rules (schema-order errors, size warnings, stale Jump line, broken parent/child/wikilink references) \u2014 currently only exercised incidentally through other test classes' fixtures, not tested directly\n\n## Children\n"}, {"path": "feature-tree/ft-cli/structural-editing.md", "text": "---\nname: structural-editing\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.StructuralEditTests\nlast_verified: 2026-10-28\n---\n# structural-editing\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nRestructuring the tree itself, not just editing a node's frontmatter. Because the parent and child relationship comes from folder nesting, deleting, renaming and moving nodes are real filesystem operations. Delete reparents the node's children by default (or removes the whole subtree on request) and only previews what it would do until the user confirms. Rename updates the parent field and every wikilink across the tree. Move reattaches a node under a new parent, or at the top level. This keeps the tree consistent so users never hand-edit paths and links.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.StructuralEditTests -v` passes (7 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Delete with child reparenting by default, optional subtree removal, and a dry run unless confirmed.\n- Rename that rewrites parent fields and wikilinks tree-wide.\n- Move to a new parent or to the top level.\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/ft-cli/work-loop.md", "text": "---\nname: work-loop\nstatus: planned\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.WorkTests skill.tests.test_ft.MarkerTests\nlast_verified: 2026-10-28\n---\n# work-loop\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe headless driver that works through a tree unattended. It launches a fresh Claude run for each todo until the next-work command reports nothing left, triaging todos that have no priority first. Each task can carry a time budget; when a run exceeds it, the todo is marked as having timed out and its whole process group is killed. Several consecutive timeouts abort the loop, and nodes that accumulate too many open todos are split automatically. A reflect step runs after work so checked items never pile up.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.WorkTests skill.tests.test_ft.MarkerTests -v` passes (10 tests: work-loop triage/limit/abort behavior, `{limit}`/`{tle}` marker parsing and lint).\n\n## Todos\n- [ ] (P2) tune default `--task-limit`/`--max-tle` once there's real usage data from running `ft work` on a non-sample tree {hitl}\n\n## Questions\n\n## Implemented\n- Headless driver with per-step prompts, process-group kill on timeout, timeout marking and automatic splitting of nodes with more than twelve open todos.\n- Time-limit and timed-out markers on todos, with lint validating their syntax.\n- Verified with a real headless run on a throwaway project using the small Haiku model: allowing edits plus a narrow set of shell commands (the tree tool, test and grep) was enough to complete a todo. Each node's own test command must also be allowed for its tests to run.\n\n## Facts & Details\n\n## Citations\n- [skill/SKILL.md](../../../skill/SKILL.md)\n\n## Archived\n- [x] (P1) `ft work`'s real `claude` invocation needs `--allowedTools` tuned so Bash commands (e.g. running a node's own test suite) aren't denied under `acceptEdits` mode during a real headless run\n\n## Children\n"}, {"path": "feature-tree/standalone-viewer.md", "text": "---\nname: standalone-viewer\nstatus: planned\nparent: feature-tree\ntests: manual\nlast_verified: 2026-10-28\n---\n# standalone-viewer\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA single-file, no-build browser viewer for anyone without VS Code or Obsidian. It reuses exactly the same tree, graph and styling code as the editor extension, swapping in a web host that reads a user-picked local folder through the browser's File System Access API instead of the VS Code messaging bridge. The view command regenerates the file from the live extension sources, so the two surfaces never drift apart.\n\n## Acceptance Tests\nmanual: open `features/viewer.html` in a browser, pick the `features/` folder when prompted, confirm the graph renders with the same colors/drawer behavior as the VS Code graph panel.\n\n## Todos\n- [x] (P1) diagnose the earlier \"blank viewer.html\" report \u2014 still need the browser name and any console error to reproduce; not yet actionable {hitl}\n- [ ] (P3) do an actual manual pass in a real browser \u2014 so far only verified indirectly via the jsdom test suite in `vscode-feature-tree/test/`, never opened for real {hitl}\n\n## Questions\n\n## Implemented\n- Web host: a stand-in for the extension's host interface built on the File System Access API, covering the folder picker, reading and writing files, and opening a raw file with the browser's default handler.\n- View command: bundles the shared code and styling plus the web host into one self-contained viewer page, regenerated after the multiple-choice question and todo-row fixes with lint still at zero errors.\nThe viewer was regenerated again after the blocked-by and human-only glyphs and the progress-rollup badge landed in the shared code.\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../SCHEMA.md)\n\n## Archived\n- [x] (P3) regenerate `features/viewer.html` (`ft view`) after the blocked-by/HITL glyphs + progress-rollup badge land in `media/` {blocked-by: vscode-extension}\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/drawer-widgets.md", "text": "---\nname: drawer-widgets\nstatus: done\nparent: vscode-extension\ntests: npm test\nlast_verified: 2026-10-28\n---\n# drawer-widgets\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe drawer's section cards and the todo-row widget, shared by the graph panel, node tab and floating box. They provide: a three-state checkbox cycle on todos, blocked-by and human-only glyphs, a node picker and a checkbox for editing those markers, multiple-choice question cards (a radio list, a recommended badge and an implicit Other choice), and the floating todo and question box.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (shared suite; relevant tests: \"drawer: ...\", \"todo row: ...\", \"MCQ: ...\", \"questions: ...\", \"blocked-by node gates the todo... shown in drawer and floating box\").\n\n## Todos\n\n## Questions\n\n## Implemented\n- Multiple-choice questions: a radio list built from the question's options, with the first option badged as recommended (the badge is display-only and never written to disk). An implicit Other row reveals the original free-text answer flow, and questions without options fall back to that flow unchanged.\n- Todo-row layout fix: the row was rebuilt with explicit sizing per control; the blocked-by selector appears only when there is an open question to block on; the time-limit input keeps a persistent clock icon; and priority color-coding matches the floating box's palette.\n- Todo rows and the floating box show a blocked-by glyph and a human-only badge. The drawer row also has a node picker and a checkbox so these markers are editable, not just displayed.\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) drawer: render `{blocked-by}`/`{hitl}` glyphs on todo rows (dimmed row + blocked icon; HITL badge), once `ft-cli`'s marker parsing lands\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/graph-panel.md", "text": "---\nname: graph-panel\nstatus: done\nparent: vscode-extension\ntests: npm test\nlast_verified: 2026-10-28\n---\n# graph-panel\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe webview graph panel (`featureTree.openGraph`): the whole tree rendered color-coded by status, zoom/pan, click-to-select drawer with jump chips, floating todo box, and a per-card progress-rollup percentage badge next to the status icon.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (shared suite; relevant tests: \"renders one card per node...\", \"feature chip navigates...\", \"empty state...\", \"citations: external links...\", \"abstract read view renders...\", \"card shows progress rollup badge...\").\n\n## Todos\n\n## Questions\n\n## Implemented\n- Graph webview: zoom/pan, status color-coding, click-to-select drawer with jump chips, floating todo box.\n- Card head renders a `pctbadge` progress-rollup percentage next to the status select, sourced from `tree.js`'s `rollupProgress`.\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/node-editor.md", "text": "---\nname: node-editor\nstatus: done\nparent: vscode-extension\ntests: node --test --test-name-pattern \"node-editor\" out/test/graph.test.js\nlast_verified: 2026-10-28\n---\n# node-editor\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA custom editor that opens a single node as its own editor tab, reusing the drawer UI instead of showing raw markdown. It re-renders live whenever the underlying document changes and talks to the file through a small write, raw and external message bridge. It is purely a visualizer and editor, with no bridge for launching agents.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` (after `tsc -p .`), then `node --test --test-name-pattern \"node-editor\" out/test/graph.test.js` passes (3 tests, all titled `node-editor mode: ...`).\n\n## Todos\n\n## Questions\n- [~] Q1: Should the custom node-editor tab replace plain markdown as the default for files under `features/`, or stay opt-in?\n  - O: Keep opt-in (current \u2014 `priority: \"option\"` in `customEditors`, opened explicitly via \"Open With\" or from the graph panel)\n  - O: Make it the default editor for `features/**/*.md` except `SCHEMA.md`\n  - A (agent): assumed default 'Keep opt-in (current \u2014 `priority: \"option\"` in `customEditors`, opened explicitly via \"Open With\" or from the graph panel)' while unattended; unconfirmed, reopen to change\n\n## Implemented\n- Single-node editor tab reusing the drawer UI, with live re-render on document changes, the write, raw and external message bridge, and styling that hides the graph chrome so the node fills the tab.\nDecision (agent-assumed, unconfirmed Q1): the editor stays opt-in, opened explicitly through Open With or from the graph panel, rather than replacing plain markdown. Revisit by reopening Q1.\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) decide whether the `featureTree.node` custom editor should become the *default* editor for `features/**/*.md` (minus `SCHEMA.md`), or stay opt-in via right-click \"Open With\" as it is now\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/vscode-extension.md", "text": "---\nname: vscode-extension\nstatus: planned\nparent: feature-tree\ntests: npm test\nlast_verified: 2026-10-28\n---\n# vscode-extension\n\nJump: [Abstract](#abstract) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA VS Code extension giving the tree a visual home instead of raw markdown, with three surfaces: [[graph-panel]], [[node-editor]] and [[drawer-widgets]]. All three share one bundle of tree-parsing, graph-drawing and styling code, switched between modes by the host that embeds it, so the parser and renderer logic is written once and tested once. The extension lives in its own folder in the repository.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (`tsc -p .` then `node --test out/test/*.test.js`; 45 tests, aggregate across all 3 children).\n\n## Todos\n- [ ] (P2) verify the extension in a real, live VS Code window (installed via the `~/.vscode/extensions` symlink) \u2014 so far only exercised through jsdom-simulated `node --test` runs, never an actual Extension Host; applies across all 3 surfaces equally {hitl}\n\n## Questions\n\n## Implemented\n\n## Facts & Details\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n- [[drawer-widgets]] (done)\n- [[graph-panel]] (done)\n- [[node-editor]] (done)\n"}];</script><script>// Shared parse + minimal-diff edit helpers for feature nodes. Used by viewer (VS Code and browser) and tests.
// Rules live in features/SCHEMA.md. Priority: 0-3, or null for unassigned "(P?)".
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.FT = factory();
})(typeof self !== "undefined" ? self : this, function () {
  const SECTIONS = ["Abstract", "Acceptance Tests", "Todos", "Questions", "Implemented", "Facts & Details", "Citations", "Archived", "Children"];
  const TODO_RE = /^- \[( |~|x)\] \(P([0-3?])\) (.+)$/;
  const WIKI_RE = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]+)?\]\]/g;
  // matches both external (https?://…) and relative-path markdown links, e.g. [SKILL.md](../../skill/SKILL.md)
  const EXT_RE = /\[([^\]]+)\]\(([^)\s]+)\)/g;
  const MARK_RE = /\s*\{(blocked-by|blocked|limit|tle|hitl)(?::\s*([^}]+))?\}\s*$/;
  const Q_RE = /^- \[( |~|x)\] (Q\d+): (.+)$/;
  const O_RE = /^\s+- O: (.+)$/;
  const A_RE = /^\s+- A(?: \((agent)\))?: (.+)$/;
  const STATUSES = ["planned", "in-progress", "done"];

  function parseFrontmatter(text) {
    const meta = {};
    if (text.startsWith("---\n")) {
      const end = text.indexOf("\n---", 4);
      if (end !== -1) {
        for (const line of text.slice(4, end).split("\n")) {
          const i = line.indexOf(":");
          if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim() || null;
        }
        return { meta, body: text.slice(end + 4).replace(/^\n+/, "") };
      }
    }
    return { meta, body: text };
  }

  function splitSections(body) {
    const secs = {};
    let cur = null;
    for (const line of body.split("\n")) {
      if (line.startsWith("## ")) { cur = line.slice(3).trim(); secs[cur] = ""; }
      else if (cur !== null) secs[cur] += line + "\n";
    }
    return secs;
  }

  function parseTodos(sectionText) {
    const todos = [];
    for (const line of sectionText.split("\n")) {
      const m = TODO_RE.exec(line.trim());
      if (!m) continue;
      let text = m[3];
      const marks = {};
      for (let b = MARK_RE.exec(text); b; b = MARK_RE.exec(text)) { text = text.slice(0, b.index); if (!(b[1] in marks)) marks[b[1]] = (b[2] || "").trim(); }
      todos.push({
        done: m[1] === "x", state: m[1], priority: m[2] === "?" ? null : Number(m[2]), text,
        blocked: marks.blocked || null, limit: marks.limit || null, tle: marks.tle || null,
        blockedBy: marks["blocked-by"] || null, hitl: "hitl" in marks,
      });
    }
    return todos;
  }

  function formatTodos(todos) {
    return todos
      .filter((t) => t.text.trim())
      .map((t) => `- [${t.state || (t.done ? "x" : " ")}] (P${t.priority == null ? "?" : t.priority}) ${t.text.trim().replace(/\n/g, " ")}${t.blocked ? " {blocked: " + t.blocked + "}" : ""}${t.blockedBy ? " {blocked-by: " + t.blockedBy + "}" : ""}${t.limit ? " {limit: " + t.limit + "}" : ""}${t.tle ? " {tle: " + t.tle + "}" : ""}${t.hitl ? " {hitl}" : ""}`)
      .join("\n");
  }

  /** state: " " open, "~" agent-answered (needs human confirm), "x" answered.
   *  options: multiple-choice offers, first = recommended; "Other" is implicit, never stored. */
  function parseQuestions(sectionText) {
    const qs = [];
    for (const line of sectionText.split("\n")) {
      const m = Q_RE.exec(line);
      if (m) { qs.push({ id: m[2], state: m[1], text: m[3], answer: null, agent: false, options: [] }); continue; }
      const o = O_RE.exec(line);
      if (o && qs.length) { qs[qs.length - 1].options.push(o[1]); continue; }
      const a = A_RE.exec(line);
      if (a && qs.length) { qs[qs.length - 1].answer = a[2]; qs[qs.length - 1].agent = !!a[1]; }
    }
    return qs;
  }

  function formatQuestions(qs) {
    return qs.map((q) => `- [${q.state}] ${q.id}: ${q.text.trim().replace(/\n/g, " ")}` +
