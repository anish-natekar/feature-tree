\ntests: python3 -m unittest skill.tests.test_ft.ReflectTests\nlast_verified: 2026-10-28\n---\n# reflect\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe archive-and-distill stage of the work cycle. Once a todo or question is confirmed finished, reflecting it moves the original line, unchanged, into the node's archive and adds one short prose note saying what is now true. The node therefore reads as a summary of its current state rather than a pile of ticked checkboxes, while the archive keeps the full trail.\n\n## Methodology\nReflection is deliberately a second step after checking something off. Flipping the checkbox is cheap and happens first; the distillation happens later in a batch, so a crash mid-task never loses the checkbox.\n\nInput is a node, exactly one target (a finished todo identified by its exact text, or a confirmed question identified by number), and a required note. Missing, ambiguous or non-matching input is rejected with a message and nothing changes; it never guesses. Only items already confirmed can be reflected, and open items and open questions are never touched.\n\nFor a todo: the line leaves the todo list, is appended to the archive exactly as written, and the note is appended to the Implemented section.\n\nFor a question: the whole block, including its option and answer lines, leaves the question list, is appended to the archive, and the note is appended to Facts and Details, since a question yields decisions and constraints rather than features.\n\nCheck mode writes nothing. It lists every confirmed-but-unreflected item, optionally within one subtree, and reports a failing result when any exist. The end-of-turn guard, the headless driver and the planning-mode gate all call this same check, so they can never disagree about what is pending.\n\nArchived text is kept verbatim so history can be audited and the daily digest can still recognize finished work. Notes should be plain behavior statements, not echoes of the task wording.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.ReflectTests -v` passes (5 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Reflect of a finished todo into archive plus Implemented note.\n- Reflect of a confirmed question into archive plus Facts note.\n- Read-only check mode used by the guards.\n\n## Facts & Details\n- Batched rather than immediate, to survive crashes.\n- One shared check keeps every guard consistent.\n\n## Citations\n- [skill/SKILL.md](../../../skill/SKILL.md)\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/ft-cli/schema.md", "text": "---\nname: schema\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.TodoStateTests\nlast_verified: 2026-10-28\n---\n# schema\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe node format itself: a small metadata header followed by nine sections in fixed order, from Abstract through Children, with a methodology section after the abstract. One file per node, one place to look. Everything else in the tool reads and writes this shape, and the linter enforces it.\n\n## Methodology\nA fixed layout was chosen over free-form notes so tools and viewers can parse without guessing and humans always know where to look.\n\nMetadata holds a name, a status (planned, in progress or done), a parent, a test command and a last-verified date. The name must be dashed lowercase and match its file; the parent must match where the file sits in the folder hierarchy, because nesting defines the tree.\n\nReading and rewriting an untouched node yields byte-identical text, so diffs only show real changes.\n\nA todo is a checkbox with three states (not started, in progress, done), a priority from zero to three or unassigned, text, and optional trailing markers in braces. Questions mirror the same three states (open, agent-answered, confirmed) and may carry options and an answer line; reusing one vocabulary avoids learning two. The next-work choice prefers an in-progress todo over a higher-priority one not yet started, so interrupted work finishes first.\n\nStatus is derived, not trusted: in progress if any todo is in progress; done only when there are no open todos or questions and both a test command and a verification date exist; otherwise planned. Indexing refreshes it along with the section jump line.\n\nThe linter has two tiers. Errors: wrong section order, malformed todo or question lines, duplicate question numbers, impossible status, bad dates, broken parent or link targets, and size above the hard limit of nine hundred words, past which a node must be split into children. Warnings: under eighty or over six hundred words, missing tests, stale jump line or status, unassigned priorities, too many open todos or children, excessive depth, a missing methodology on a finished leaf, and prose that reads like code documentation.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.TodoStateTests -v` passes (2 tests: 3-state checkbox parse/format round-trip).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Metadata header and ten fixed sections.\n- Lossless read-and-rewrite.\n- Three-state todos and questions, derived status.\n- Tiered lint rules.\n\n## Facts & Details\n- The size ceiling forces splitting rather than sprawling nodes.\n- Status is computed so it cannot be hand-faked without a warning.\n\n## Citations\n- [skill/scripts/ft.py](../../../skill/scripts/ft.py)\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) add a dedicated test class for `ft lint`'s base rules (schema-order errors, size warnings, stale Jump line, broken parent/child/wikilink references) \u2014 currently only exercised incidentally through other test classes' fixtures, not tested directly\n\n## Children\n"}, {"path": "feature-tree/ft-cli/structural-editing.md", "text": "---\nname: structural-editing\nstatus: done\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.StructuralEditTests\nlast_verified: 2026-10-28\n---\n# structural-editing\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nRestructuring the tree itself: deleting, renaming and moving nodes. Because parent and child relationships come from folder nesting, each of these changes files on disk, so doing it by hand risks broken links and mismatched parents. The tool performs them consistently so users never edit paths.\n\n## Methodology\nNodes that have children live in a folder of their own name, so moving or deleting one carries or removes the whole folder.\n\nDelete: by default the node's children are reattached to its own parent (or the top level if it had none) and only then is the node removed. Optionally the whole subtree goes. Without explicit confirmation it only previews what would happen and changes nothing. Preview is the default because removal is irreversible and destroys planning history that may exist only in the working tree. Children are reparented rather than cascaded because deleting a branch usually means merging it away, not discarding its children's work.\n\nRename: the new name must be unique and in dashed lowercase form. The node's file and folder are renamed, its name field updated, its children's parent field updated, and every link to it anywhere in the tree, including links with a heading or alias suffix, is rewritten. Links are fixed tree-wide so no reader ever follows a dead reference.\n\nMove: reattaches a node with all its descendants under a new parent, or at the top level when given the root marker. A parent that does not exist, the current parent, or one of the node's own descendants is rejected. If the target parent was a plain file it is first promoted to a folder.\n\nAfter any of these, the section index and statuses are refreshed so the tree is immediately consistent.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.StructuralEditTests -v` passes (7 tests).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Delete with reparenting, optional subtree removal and a preview-only default.\n- Rename with tree-wide link rewriting.\n- Move of a whole subtree with validation.\n\n## Facts & Details\n- Only available from the command line and the skill; the viewer has no buttons for it.\n- Folder-derived nesting is the reason these are file operations at all.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/ft-cli/work-loop.md", "text": "---\nname: work-loop\nstatus: planned\nparent: ft-cli\ntests: python3 -m unittest skill.tests.test_ft.WorkTests skill.tests.test_ft.MarkerTests\nlast_verified: 2026-10-28\n---\n# work-loop\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe headless driver that works through the plan with no human present. It repeatedly starts a fresh agent session for one step, then checks the plan on disk to decide what to do next, until nothing is left. The plan files, not any session memory, carry all the state.\n\n## Methodology\nEach round the driver first checks two preconditions: the pause switch must be off (otherwise it stops with its own exit code) and the plan must have no lint errors.\n\nIt then picks one step, in this priority order:\n1. Split an oversized node (too long, or more than twelve open todos).\n2. Reflect confirmed items.\n3. Triage todos that have no priority.\n4. Do the next ready todo.\n5. Research open questions, once.\nWhen none applies the run ends and prints any open questions for the human.\n\nA fresh session handles each step, which keeps context small and makes every step restartable. Afterward the driver fingerprints the plan files to detect progress, which catches an agent that claims success but changed nothing.\n\nTime budget: each todo has a default limit, overridable per todo with a duration such as twenty minutes; other step kinds share a longer limit. On expiry the session's entire process group is killed. A work todo is then tagged as timed out so it is skipped from then on, while a timed-out step of any other kind stops the run.\n\nStopping conditions, each with a distinct exit code: the step cap is reached (default ten); several timeouts in a row (default three); the same todo is still next after a full pass; no plan change after a work step; or the agent exits with an error.\n\nThe log of each step is kept and the last lines echoed. A dry run shows what would execute without running it. The driver never bypasses permissions on its own; the caller supplies them, and each node's own test command must be permitted too.\n\n## Acceptance Tests\n`python3 -m unittest skill.tests.test_ft.WorkTests skill.tests.test_ft.MarkerTests -v` passes (10 tests: work-loop triage/limit/abort behavior, `{limit}`/`{tle}` marker parsing and lint).\n\n## Todos\n- [ ] (P2) tune default `--task-limit`/`--max-tle` once there's real usage data from running `ft work` on a non-sample tree {hitl}\n\n## Questions\n\n## Implemented\n- Step selection, preconditions, time budgets and stop conditions.\n- Per-step logs and a dry run.\n- Timeout tagging of stuck todos.\n\n## Facts & Details\n- Defaults for the time limit and timeout cap are placeholders awaiting real usage data.\n- A real run on a throwaway project with the small model completed a todo once edits and a narrow set of commands were permitted.\n\n## Citations\n- [skill/SKILL.md](../../../skill/SKILL.md)\n\n## Archived\n- [x] (P1) `ft work`'s real `claude` invocation needs `--allowedTools` tuned so Bash commands (e.g. running a node's own test suite) aren't denied under `acceptEdits` mode during a real headless run\n\n## Children\n"}, {"path": "feature-tree/standalone-viewer/live-editing.md", "text": "---\nname: live-editing\nstatus: done\nparent: standalone-viewer\ntests: manual\nlast_verified: 2026-10-28\n---\n# live-editing\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe mode the standalone viewer enters after the person picks the plan folder: it reads the real files, keeps itself up to date as they change, and writes edits back. This turns a static picture into a working editor without any server, while limiting what a browser page can touch.\n\n## Methodology\nGoing live:\n1. The person grants read and write access to the plan folder through the browser's native folder chooser.\n2. The viewer reads every markdown file in it, including nested ones, plus the marker that says a human paused agent work.\n3. While the page is visible it rescans every second and a half and redraws only if some file changed, so edits by agents or other tools appear without a reload.\n\nWriting: an edit in the page is written back to the same file, changing only the touched section. Only markdown files that already exist inside the chosen folder can be written; paths that are empty, climb upward, or lack the markdown ending are rejected, and the viewer never creates files. This keeps a browser page from touching anything outside the plan.\n\nEdge cases: scanning pauses while the page is hidden to avoid wasted work, and resumes when it becomes visible. The folder permission lasts for the page session only, so reopening the page returns to the read-only snapshot (see [[snapshot-mode]]) until a folder is picked again.\n\nData kept: none; the plan files in the chosen folder are the only state.\n\n## Acceptance Tests\nmanual checklist: pick the plan folder and confirm the snapshot notice disappears; edit a file with another tool and confirm the page updates within a few seconds; edit a todo in the page and confirm only that file changes; confirm no new file is ever created.\n\n## Todos\n\n## Questions\n\n## Implemented\n- Folder picker that switches to live mode.\n- Periodic rescan that redraws on change.\n- Guarded write-back to existing markdown files only.\n\n## Facts & Details\n- Why a guarded write path: a browser page should never write outside the plan or create files.\n- Why polling: it needs no server and works with edits from any tool.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/standalone-viewer/snapshot-mode.md", "text": "---\nname: snapshot-mode\nstatus: done\nparent: standalone-viewer\ntests: manual\nlast_verified: 2026-10-28\n---\n# snapshot-mode\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe state in which the standalone viewer first opens: it carries a copy of the plan taken when the file was generated, so the page is already populated and a first-time visitor sees a map immediately. It is read-only and tells the person how to go live. This exists so a shared viewer is useful the moment it is opened.\n\n## Methodology\nWhen the file is generated, the whole plan is read and embedded in the page. On open, the viewer draws that embedded copy exactly as it would draw a live plan, using the same drawing and styling as the editor extension.\n\nBecause no folder has been chosen yet, the page has no permission to write anywhere. Any attempt to edit shows a message telling the person to pick the plan folder, and nothing is changed.\n\nA toolbar notice states that the view is a read-only snapshot and shows the time the snapshot was taken, so a reader knows how old the picture is and that it will not follow later edits. The notice disappears once a plan folder is picked and the viewer goes live (see [[live-editing]]).\n\nAn earlier version opened blank until a folder was chosen, which was a genuine defect: a visitor saw an empty page with no hint of what the viewer was for. The embedded copy fixes this, and the snapshot is regenerated whenever the file is rebuilt, so it is only as fresh as its last generation.\n\nData kept: only the embedded copy and its generation time; nothing is stored by the page.\n\n## Acceptance Tests\nmanual checklist: open the generated viewer with no folder picked and confirm the graph is populated; the toolbar shows a read-only snapshot notice with a generation time; attempting an edit shows a message asking for the plan folder and changes nothing.\n\n## Todos\n\n## Questions\n\n## Implemented\n- Embedded snapshot so the page opens populated, read-only.\n- Toolbar notice with the time the snapshot was taken and that it is read-only; it disappears once a plan folder is picked.\n\n## Facts & Details\n- Why a snapshot rather than an empty state: a shareable viewer should show a populated map at once.\n- The earlier blank-on-open behaviour was diagnosed and replaced by the snapshot.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P1) diagnose the earlier \"blank viewer.html\" report \u2014 still need the browser name and any console error to reproduce; not yet actionable {hitl}\n- [x] (P2) show a visible banner on a generated viewer saying it is a read-only snapshot with its generation time, and how to go live\n\n## Children\n"}, {"path": "feature-tree/standalone-viewer/standalone-viewer.md", "text": "---\nname: standalone-viewer\nstatus: planned\nparent: feature-tree\ntests: manual\nlast_verified: 2026-10-28\n---\n# standalone-viewer\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA single-file viewer that opens in an ordinary browser, for anyone without the editor extension or a notes app. It needs no server and no build step, and it contains the same tree parsing, graph drawing and styling as the editor extension, so both surfaces look and behave the same. Only the host differs: a small browser host reads and writes plan files in a folder the person picks.\n\n## Methodology\nThe viewer has two modes and moves from the first to the second. It first opens as a read-only snapshot of the plan, described in [[snapshot-mode]], and becomes a live, editable view once the person picks the plan folder, described in [[live-editing]].\n\nGeneration: the file is rebuilt as a whole from the live extension sources, with the snapshot embedded, so the viewer cannot drift from the extension and every fix to cards, glyphs or progress badges arrives on the next regeneration.\n\nData kept: none of its own beyond the embedded snapshot; the plan files in the chosen folder are the only state.\n\n## Acceptance Tests\nmanual: open the generated viewer in a browser, pick the `features/` folder when prompted, confirm the graph renders with the same colors and drawer behavior as the VS Code graph panel.\n\n## Todos\n- [ ] (P3) do an actual manual pass in a real browser \u2014 so far only verified indirectly via the jsdom test suite in `vscode-feature-tree/test/`, never opened for real {hitl}\n\n## Questions\n\n## Implemented\n- Regeneration from the shared extension sources.\n\n## Facts & Details\n- Why shared code: one implementation for both surfaces prevents drift.\n- Verification gap: so far it has only been exercised through a simulated browser test suite, never opened by hand in a real browser. That manual pass needs a human.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P3) regenerate `features/viewer.html` (`ft view`) after the blocked-by/HITL glyphs + progress-rollup badge land in `media/` {blocked-by: vscode-extension}\n\n## Children\n- [[live-editing]] (done)\n- [[snapshot-mode]] (done)\n"}, {"path": "feature-tree/vscode-extension/drawer-widgets/drawer-widgets.md", "text": "---\nname: drawer-widgets\nstatus: done\nparent: vscode-extension\ntests: npm test\nlast_verified: 2026-10-28\n---\n# drawer-widgets\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe reusable pieces inside the detail drawer that appears when a node is selected: section cards, the todo row, and the multiple-choice question card. The same pieces appear in the graph panel, the single-node editor tab and the floating todo and question box, so a todo or question looks and behaves the same everywhere. They turn plan markers into visible controls.\n\n## Methodology\nEvery widget reads a section of the node's markdown and rewrites only that section when changed, so the node's own file is the only state. Nothing else is stored.\n\nSection cards show each part of the node. Prose inside them renders numbered and bulleted lines as real lists, so step-by-step methodology reads as steps instead of one run-on paragraph.\n\nThe two interactive widgets are described in their own nodes: [[todo-rows]] for the collapsible todo row and its marker controls, and [[questions-widget]] for the multiple-choice question card.\n\nFloating box: a draggable window with tabs for todos, questions and items needing a human. Filters cover priority, question state, subtree, text and done items. The human tab gathers open and agent-answered questions, blockers first, plus open human-only todos. It reuses the same row and card widgets, so nothing looks different between the drawer and the box.\n\nSecondary controls hide when collapsed so the list does not become a wall of boxes.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (shared suite; relevant tests: \"drawer: ...\", \"todo row: ...\", \"MCQ: ...\", \"questions: ...\", \"blocked-by node gates the todo... shown in drawer and floating box\").\n\n## Todos\n\n## Questions\n\n## Implemented\n- Section cards with list rendering for numbered and bulleted prose.\n- Floating todo and question box with tabs and filters.\n- Todo row and question card, detailed in the children.\n\n## Facts & Details\n- Decision: collapsed rows hide secondary controls.\n- Data kept: nothing beyond the node's own markdown.\n\n## Citations\n- [features/SCHEMA.md](../../../SCHEMA.md)\n\n## Archived\n- [x] (P2) drawer: render `{blocked-by}`/`{hitl}` glyphs on todo rows (dimmed row + blocked icon; HITL badge), once `ft-cli`'s marker parsing lands\n- [x] (P1) render numbered and bulleted lists inside prose sections as real lists (they currently run together as one paragraph)\n\n## Children\n- [[questions-widget]] (done)\n- [[todo-rows]] (done)\n"}, {"path": "feature-tree/vscode-extension/drawer-widgets/questions-widget.md", "text": "---\nname: questions-widget\nstatus: done\nparent: drawer-widgets\ntests: npm test\nlast_verified: 2026-10-28\n---\n# questions-widget\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe question card shown in the drawer and the floating box, used by a human to answer questions that agents logged. It supports both a short list of concrete options and free-text answers, and it keeps blocked todos consistent when a question is resolved.\n\n## Methodology\nWith options, the card shows a radio list. The first option is badged as recommended; this is display only and is never saved into the answer. An Other row is always appended and reveals a free-text answer box when picked. The saved answer looks the same whether the person picked a listed option or typed their own.\n\nWithout options, the card uses the plain free-text flow unchanged.\n\nAn answer given by a person is recorded as confirmed. An answer an agent gave after research stays marked as unconfirmed until the person confirms or reopens it from the card.\n\nWhen a question is answered or removed, any todo blocked on it loses that blocked marker automatically, so no todo is left waiting on something already settled.\n\nWhy the first option is the recommendation: that is how agents already phrase multiple-choice questions, so no extra data is needed. Data kept: nothing beyond the question block in the node's own markdown.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (relevant tests: \"MCQ: ...\", \"questions: ...\").\n\n## Todos\n\n## Questions\n\n## Implemented\n- Multiple-choice question card with recommended badge and Other row.\n- Automatic removal of blocked markers when a question is resolved.\n\n## Facts & Details\n- Decision: the first option is the recommendation; nothing extra is stored.\n\n## Citations\n- [features/SCHEMA.md](../../../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/drawer-widgets/todo-rows.md", "text": "---\nname: todo-rows\nstatus: done\nparent: drawer-widgets\ntests: npm test\nlast_verified: 2026-10-28\n---\n# todo-rows\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe todo row shown in the drawer and the floating box. It lets a person see a long list of todos at a glance and, when needed, change a todo's state, priority, time limit and blockers in place. It turns the textual markers on a todo line into visible, editable controls.\n\n## Methodology\nCollapsed, a row shows only the state selector, a coloured priority badge and the text, so long lists stay scannable. Expanded, it reveals priority, time limit, blocked-on and blocked-by controls, a human-only toggle and a delete control.\n\nState is open, in progress or done, picked directly from a selector rather than cycled by clicking. Choosing done also marks it complete.\n\nMarkers become glyphs:\n- Blocked, when the todo waits on a question still open or on a node not yet done.\n- A different glyph when it was aborted at its time limit.\n- A person badge when it needs a live human and unattended runs skip it.\n\nThe blocked-on choice lists only open questions (plus any already set), so it is absent when there is nothing to block on. Priority colours match the floating box so urgency reads the same in both places.\n\nEdits save after a short pause in typing and on leaving the field, and only the todos section of the node is rewritten. Deleting a todo removes only its line.\n\nData kept: nothing beyond the todo line in the node's own markdown.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (relevant tests: \"todo row: ...\", \"blocked-by node gates the todo... shown in drawer and floating box\").\n\n## Todos\n\n## Questions\n\n## Implemented\n- Collapsible todo row with state selector, priority badge and marker controls.\n- Blocked, time-limit and human-only glyphs.\n\n## Facts & Details\n- Decision: collapsed rows hide secondary controls so the list stays readable.\n- Decision: state is chosen from a selector, not cycled by clicking, to avoid accidental changes.\n\n## Citations\n- [features/SCHEMA.md](../../../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/graph-panel.md", "text": "---\nname: graph-panel\nstatus: done\nparent: vscode-extension\ntests: npm test\nlast_verified: 2026-10-28\n---\n# graph-panel\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nThe main visual surface of the extension: the whole plan drawn as a graph of cards, one per node, joined to their parents by lines. Each card is coloured by status and shows a progress percentage. The panel opens beside the code and follows the plan folder live, so a person can read and edit the plan without leaving the editor.\n\n## Methodology\nInput and layout:\n1. Read every markdown node under the plan folder. Files without a status in their header, and the schema file, are ignored.\n2. Attach each node to the parent named in its header.\n3. Draw one card per node. Cards expand to show their abstract or collapse to save space. Toolbar buttons expand all, collapse all, and fit the graph into view. The first load fits automatically; fitting never zooms in past natural size and never below a readable minimum.\n\nNavigation: dragging empty space pans, the wheel zooms around the cursor between a low and a high limit, and dragging on a card does not pan, so cards can be used without moving the view.\n\nSelection: clicking a card opens a drawer with all sections and chips that jump to related nodes. A legend counts nodes per status, and status can be changed on the card itself. Opening a node's full page launches the single-node editor.\n\nProgress badge: the share of done todos across the node and all its descendants, hidden when the subtree has no todos. Descendants are counted so a branch shows how far its whole subtree has come, which its own todos could not tell.\n\nOther surfaces: a toolbar toggle opens the tree-wide todo and question box; a banner says when and by whom agent work was paused; with no nodes, an empty state invites opening the plan folder.\n\nLive updates: the panel reloads whenever any plan file is created, changed or deleted, but does not rebuild the drawer while the person is typing in it. Writes go through the editor's own document so open tabs stay in sync and undo works.\n\nLinks: file links open only inside the workspace and outside ones are refused with a warning; web links open externally.\n\nOnly one panel exists at a time; invoking it again reveals the existing one. It activates only in workspaces containing a plan, and is reachable from a status bar button and a sidebar welcome button.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (shared suite; relevant tests: \"renders one card per node...\", \"feature chip navigates...\", \"empty state...\", \"citations: external links...\", \"abstract read view renders...\", \"card shows progress rollup badge...\").\n\n## Todos\n\n## Questions\n\n## Implemented\n- Card graph with status colours, expand and collapse, fit, pan and zoom.\n- Detail drawer with jump chips and status legend.\n- Progress badge with subtree rollup.\n- Toolbar toggle for the floating box, paused banner and empty state.\n- Live reload on any plan file change.\n- Safe link handling.\n\n## Facts & Details\n- Decision: one panel at a time.\n- Decision: the progress badge counts descendants.\n- Writes go through the editor's own document.\n- Activation only in workspaces that contain the plan.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/node-editor.md", "text": "---\nname: node-editor\nstatus: done\nparent: vscode-extension\ntests: node --test --test-name-pattern \"node-editor\" out/test/graph.test.js\nlast_verified: 2026-10-28\n---\n# node-editor\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA custom editor that opens a single plan node as its own editor tab, showing the same section cards as the graph drawer instead of raw markdown. It stays in sync with the underlying document, so edits by a person, an agent or another tool appear immediately. It is purely a viewer and editor and cannot launch agents.\n\n## Methodology\nOpening: the editor is opt-in. A person chooses it from the open-with menu on a plan file, or reaches it from a card in the graph panel. Plain markdown stays the default, because replacing it would surprise people who just want to edit text or diff in version control. Whether to make it the default for plan files is an open question, assumed to stay opt-in meanwhile.\n\nDisplay: the graph chrome (toolbar, canvas, floating box) is hidden so the single node fills the tab. The node is identified by its path relative to the plan folder, or just its file name if the file lies outside it.\n\nSync loop:\n1. When the document changes, for any reason, push the full text to the page and redraw.\n2. Do not rebuild the drawer while a field has focus, so typing is not interrupted.\n3. When the person changes something in the page, replace the whole document text and save.\n4. Ignore a write whose text equals the current text, which prevents echo loops.\n\nBecause writes go through the editor's own document, undo works and other open tabs stay consistent.\n\nRaw view: a control reopens the same file in the plain text editor in the same tab group.\n\nLinks: a relative link opens its target if it exists inside the workspace; otherwise a warning is shown.\n\nMessages between page and host are deliberately few: ready, write, raw view, open link and open web address. No message can start a process, which is why this surface cannot launch agents.\n\nData kept: none of its own; the document is the only state.\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` (after `tsc -p .`), then `node --test --test-name-pattern \"node-editor\" out/test/graph.test.js` passes (3 tests, all titled `node-editor mode: ...`).\n\n## Todos\n\n## Questions\n\n## Implemented\n- Opt-in custom editor for plan files.\n- Single-node view with graph chrome hidden.\n- Live two-way sync with the document, undo support.\n- Raw view switch and guarded link opening.\n\n## Facts & Details\n- The message set between page and host is deliberately minimal and cannot start a process.- Decided (confirmed by the human): the custom node editor stays opt-in, opened explicitly from the graph panel or via Open With. Plain markdown remains the default so hand editing is never surprising.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) decide whether the `featureTree.node` custom editor should become the *default* editor for `features/**/*.md` (minus `SCHEMA.md`), or stay opt-in via right-click \"Open With\" as it is now\n- [x] Q1: Should the custom node-editor tab replace plain markdown as the default for files under `features/`, or stay opt-in?\n  - O: Keep opt-in (current \u2014 `priority: \"option\"` in `customEditors`, opened explicitly via \"Open With\" or from the graph panel)\n  - O: Make it the default editor for `features/**/*.md` except `SCHEMA.md`\n  - A (agent): assumed default 'Keep opt-in (current \u2014 `priority: \"option\"` in `customEditors`, opened explicitly via \"Open With\" or from the graph panel)' while unattended; unconfirmed, reopen to change\n\n## Children\n"}, {"path": "feature-tree/vscode-extension/vscode-extension.md", "text": "---\nname: vscode-extension\nstatus: done\nparent: feature-tree\ntests: npm test\nlast_verified: 2026-10-28\n---\n# vscode-extension\n\nJump: [Abstract](#abstract) \u00b7 [Methodology](#methodology) \u00b7 [Acceptance Tests](#acceptance-tests) \u00b7 [Todos](#todos) \u00b7 [Questions](#questions) \u00b7 [Implemented](#implemented) \u00b7 [Facts & Details](#facts-&-details) \u00b7 [Citations](#citations) \u00b7 [Archived](#archived) \u00b7 [Children](#children)\n\n## Abstract\nA VS Code extension giving the tree a visual home instead of raw markdown, with three surfaces: [[graph-panel]], [[node-editor]] and [[drawer-widgets]]. All three share one bundle of tree-parsing, graph-drawing and styling code, switched between modes by the host that embeds it, so the parser and renderer logic is written once and tested once. The extension lives in its own folder in the repository.\n\n## Methodology\n\n## Acceptance Tests\n`cd vscode-feature-tree && npm test` passes (`tsc -p .` then `node --test out/test/*.test.js`; 45 tests, aggregate across all 3 children).\n\n## Todos\n\n## Questions\n\n## Implemented\nConfirmed by the human in a live editor window: the graph panel shows the plan, the node editor works, and drawer edits reach the files. The folder picker is intentionally absent in the editor, since the open workspace is the source.\n\n## Facts & Details\n\n- Human check (2026-10-29): the graph panel opened in a live editor window and showed the same tree as the plan files. The node editor and the drawer editing paths are not yet confirmed live.\n\n## Citations\n- [features/SCHEMA.md](../../SCHEMA.md)\n\n## Archived\n- [x] (P2) verify the extension in a real, live VS Code window (installed via the `~/.vscode/extensions` symlink) \u2014 so far only exercised through jsdom-simulated `node --test` runs, never an actual Extension Host; applies across all 3 surfaces equally {hitl}\n\n## Children\n- [[drawer-widgets]] (done)\n- [[graph-panel]] (done)\n- [[node-editor]] (done)\n"}];window.FT_SNAPSHOT_AT="2026-10-29 10:58";</script><script>// Shared parse + minimal-diff edit helpers for feature nodes. Used by viewer (VS Code and browser) and tests.
// Rules live in features/SCHEMA.md. Priority: 0-3, or null for unassigned "(P?)".
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.FT = factory();
})(typeof self !== "undefined" ? self : this, function () {
  const SECTIONS = ["Abstract", "Methodology", "Acceptance Tests", "Todos", "Questions", "Implemented", "Facts & Details", "Citations", "Archived", "Children"];
  const TODO_RE = /^- \[( |~|x)\] \(P([0-3?])\) (.+)$/;
  const WIKI_RE = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]+)?\]\]/g;
  // matches both external (https?://…) and relative-path markdown links, e.g. [SKILL.md](../../skill/SKILL.md)
  const EXT_RE = /\[([^\]]+)\]\(([^)\s]+)\)/g;
  const MARK_RE = /\s*\{(blocked-by|blocked|limit|tle|hitl)(?::\s*([^}]+))?\}\s*$/;
  const Q_RE = /^- \[( |~|x)\] (Q\d+): (.+)$/;
  const O_RE = /^\s+- O: (.+)$/;
  const A_RE = /^\s+- A(?: \((agent)\))?: (.+)$/;
  const STATUSES = ["planned", "in-progress", "done"];

  function parseFrontmatter(text) {
    const meta = {};
    if (text.startsWith("---\n")) {
      const end = text.indexOf("\n---", 4);
      if (end !== -1) {
        for (const line of text.slice(4, end).split("\n")) {
          const i = line.indexOf(":");
          if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim() || null;
        }
        return { meta, body: text.slice(end + 4).replace(/^\n+/, "") };
      }
    }
    return { meta, body: text };
  }

  function splitSections(body) {
    const secs = {};
    let cur = null;
    for (const line of body.split("\n")) {
      if (line.startsWith("## ")) { cur = line.slice(3).trim(); secs[cur] = ""; }
      else if (cur !== null) secs[cur] += line + "\n";
    }
    return secs;
  }

  function parseTodos(sectionText) {
    const todos = [];
    for (const line of sectionText.split("\n")) {
      const m = TODO_RE.exec(line.trim());
      if (!m) continue;
      let text = m[3];
      const marks = {};
      for (let b = MARK_RE.exec(text); b; b = MARK_RE.exec(text)) { text = text.slice(0, b.index); if (!(b[1] in marks)) marks[b[1]] = (b[2] || "").trim(); }
      todos.push({
        done: m[1] === "x", state: m[1], priority: m[2] === "?" ? null : Number(m[2]), text,
        blocked: marks.blocked || null, limit: marks.limit || null, tle: marks.tle || null,
        blockedBy: marks["blocked-by"] || null, hitl: "hitl" in marks,
      });
    }
    return todos;
  }

  function formatTodos(todos) {
    return todos
      .filter((t) => t.text.trim())
      .map((t) => `- [${t.state || (t.done ? "x" : " ")}] (P${t.priority == null ? "?" : t.priority}) ${t.text.trim().replace(/\n/g, " ")}${t.blocked ? " {blocked: " + t.blocked + "}" : ""}${t.blockedBy ? " {blocked-by: " + t.blockedBy + "}" : ""}${t.limit ? " {limit: " + t.limit + "}" : ""}${t.tle ? " {tle: " + t.tle + "}" : ""}${t.hitl ? " {hitl}" : ""}`)
      .join("\n");
  }

  /** state: " " open, "~" agent-answered (needs human confirm), "x" answered.
   *  options: multiple-choice offers, first = recommended; "Other" is implicit, never stored. */
  function parseQuestions(sectionText) {
    const qs = [];
    for (const line of sectionText.split("\n")) {
      const m = Q_RE.exec(line);
      if (m) { qs.push({ id: m[2], state: m[1], text: m[3], answer: null, agent: false, options: [] }); continue; }
      const o = O_RE.exec(line);
      if (o && qs.length) { qs[qs.length - 1].options.push(o[1]); continue; }
      const a = A_RE.exec(line);
      if (a && qs.length) { qs[qs.length - 1].answer = a[2]; qs[qs.length - 1].agent = !!a[1]; }
    }
    return qs;
  }

  function formatQuestions(qs) {
    return qs.map((q) => `- [${q.state}] ${q.id}: ${q.text.trim().replace(/\n/g, " ")}` +
      (q.options || []).map((o) => `\n  - O: ${o.trim().replace(/\n/g, " ")}`).join("") +
      (q.answer ? `\n  - A${q.agent ? " (agent)" : ""}: ${q.answer.trim().replace(/\n/g, " ")}` : "")).join("\n");
  }

  function nextQuestionId(qs) {
    return "Q" + (Math.max(0, ...qs.map((q) => Number(q.id.slice(1)))) + 1);
  }

  const isBlocked = (todo, qs) => !!todo.blocked && qs.some((q) => q.id === todo.blocked && q.state === " ");

  // Cross-branch gate: blocked while the target node (anywhere in the tree) isn't done. nodes: Map name -> node.
  const isBlockedByNode = (todo, nodes) => !!todo.blockedBy && nodes.has(todo.blockedBy) && nodes.get(todo.blockedBy).status !== "done";

  /** (total, done) todo count across a node and all its descendants. nodes: Map name -> node. */
  function rollupProgress(node, nodes) {
    let total = node.todos.length;

      if (t.tle) summary.append(Object.assign(el("span", "blk-tag", "⏱"), { title: "Aborted at the time limit (" + t.tle + ") — expand to retry" }));
      if (t.hitl) summary.append(Object.assign(el("span", "hitl-tag", "👤"), { title: "Needs a live human — excluded from --afk-only runs" }));
      summary.append(del);
      r.append(summary);

      const body = el("div", "tdetail");
      body.append(prSel(t.priority, (v) => {
        t.priority = v;
        prBadge.className = "pbadge p" + (v == null ? "?" : v);
        prBadge.textContent = v == null ? "P?" : "P" + v;
        save();
      }));

      // a visible clock icon so this reads as "time limit" even when empty, not a mystery blank box
      const limWrap = el("span", "limwrap");
      limWrap.title = "Time limit for the agent before this todo aborts (TLE), e.g. 20m. Blank = ft work's default.";
      const lim = el("input", "lim"); lim.value = t.limit || ""; lim.placeholder = "default";
      lim.onchange = () => { t.limit = /^\d+[smh]$/.test(lim.value.trim()) ? lim.value.trim() : null; lim.value = t.limit || ""; save(); };
      limWrap.append(el("span", "ico", "⏱"), lim);
      body.append(limWrap);

      // only show "blocked on" when there's an actual open/pending question to block on (or one already set) —
      // an empty dropdown with nothing to pick is the "shows nothing" box, so just don't render it then
      const blockable = n.questions.filter((q) => q.state !== "x" || q.id === t.blocked);
      if (blockable.length) {
        const bl = el("select", "blk");
        bl.title = "Pause this todo until a question is answered";
        bl.append(Object.assign(el("option", "", "not blocked"), { value: "" }));
        for (const q of blockable) bl.append(Object.assign(el("option", "", "⛔ " + q.id), { value: q.id }));
        bl.value = t.blocked || "";
        bl.onchange = () => { t.blocked = bl.value || null; save(); };
        body.append(bl);
      }

      const bbSel = el("select", "blk");
      bbSel.title = "Pause this todo until a node (anywhere in the tree) is done";
      bbSel.append(Object.assign(el("option", "", "not blocked by a node"), { value: "" }));
      for (const name of [...nodes.keys()].sort()) if (name !== n.name) bbSel.append(Object.assign(el("option", "", "⛔ " + name), { value: name }));
      bbSel.value = t.blockedBy || "";
      bbSel.onchange = () => { t.blockedBy = bbSel.value || null; save(); };
      body.append(bbSel);

      const hitlLbl = el("label", "hitl-toggle");
      const hitlCb = el("input"); hitlCb.type = "checkbox"; hitlCb.checked = !!t.hitl;
      hitlCb.onchange = () => { t.hitl = hitlCb.checked; save(); };
      hitlLbl.append(hitlCb, " 👤 needs a human (HITL)");
      body.append(hitlLbl);

      if (t.tle) {
        const retry = el("span", "btn tle", "⏱ TLE " + t.tle + " ↻");
        retry.title = "Aborted at the time limit. Click to clear and let the agent retry (consider splitting the todo or raising the limit)";
        retry.onclick = () => { t.tle = null; save(); box.replaceChildren(...build()); };
        body.append(retry);
      }
      r.append(body);
      return r;
    }
    function build() {
      const rows = todos.map(row);
      const add = el("div", "todo add");
      const pr = prSel(null, () => {});
      const txt = el("input", "txt"); txt.placeholder = "New todo or issue… ([[ links a feature, priority ? = Claude infers)";
      attachComplete(txt);
      txt.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && txt.value.trim() && !document.querySelector(".ac")) {
          todos.push({ done: false, priority: pr.value === "?" ? null : Number(pr.value), text: txt.value, blocked: null });
          save();
          box.replaceChildren(...build());
          box.querySelector(".add .txt").focus();
        }
      });
      add.append(el("span", "cbspace"), pr, txt);
      return [...rows, add];
    }
    box.append(...build());
    return field("Todos", box);
  }

  // write the Questions section and drop {blocked} markers whose question is no longer open (or gone)
  function writeQuestions(n, qs) {
    const open = new Set(qs.filter((q) => q.state === " ").map((q) => q.id));
    const todos = n.todos.map((t) => (t.blocked && !open.has(t.blocked) ? { ...t, blocked: null } : t));
    commit(n, (t) => FT.setSection(FT.setSection(t, "Questions", FT.formatQuestions(qs)), "Todos", FT.formatTodos(todos)));
  }

  function questionBox(n) {
    const qs = n.questions.map((q) => ({ ...q }));
    const box = el("div", "qs");
    const save = (rebuild) => {
      writeQuestions(n, qs);
      if (rebuild) renderDrawer();
    };
    function row(q) {
      const kind = q.state === " " ? "open" : q.state === "~" ? "pend" : "done";
      const r = el("div", "q " + kind);
      const head = el("div", "qhead");
      head.append(el("span", "qid", q.id), el("span", "qstate", kind === "open" ? "open" : kind === "pend" ? "agent answer, confirm?" : "answered"));
      const del = el("span", "btn", "×"); del.title = "Delete question (also unblocks its todos)";
      del.onclick = () => {
        qs.splice(qs.indexOf(q), 1);
        writeQuestions(n, qs);
        renderDrawer();
      };
      head.append(del);
      const txt = el("textarea"); txt.rows = 2; txt.value = q.text;
      txt.addEventListener("input", () => { q.text = txt.value; debounced(n.name + q.id, () => save(false)); });
      txt.addEventListener("blur", () => save(false));
      attachComplete(txt);

      const optsInp = el("input", "opts");
      optsInp.value = q.options.join(", ");
      optsInp.placeholder = "Multiple choice: first, second, … (first = recommended; “Other” is automatic)";
      optsInp.title = "Like AskUserQuestion: list concrete choices here. The first is the recommended one; an Other box always appears too.";
      optsInp.addEventListener("blur", () => {
        const next = optsInp.value.split(",").map((s) => s.trim()).filter(Boolean);
        if (next.join("\u0001") === q.options.join("\u0001")) return;
        q.options = next;
        save(true);
      });

      const ans = el("textarea", "ans"); ans.rows = 2; ans.value = q.answer || "";
      ans.placeholder = "Your answer… (cite sources as [text](url))";
      attachComplete(ans);
      if (q.state !== " ") {
        ans.addEventListener("blur", () => {
          if (ans.value.trim() === (q.answer || "")) return;
          q.answer = ans.value.trim() || null; q.agent = false; q.state = q.answer ? "x" : " ";
          save(true); // human edit counts as confirmation
        });
      }
      const btns = el("div", "qbtns");
      const b = (label, fn) => { const x = el("button", "", label); x.onclick = fn; btns.append(x); };
      if (q.state === " ") b("Answer", () => { if (!ans.value.trim()) return; q.answer = ans.value.trim(); q.agent = false; q.state = "x"; save(true); });
      if (q.state === "~") b("Confirm", () => { q.state = "x"; q.agent = false; save(true); });
      if (q.state !== " ") b("Reopen", () => { q.state = " "; q.answer = null; q.agent = false; save(true); });
      r.append(head, txt, optsInp);

      if (q.state === " " && q.options.length) {
        // AskUserQuestion-style: pick a listed choice (first = recommended), or "Other" for free text
        const mc = el("div", "mc");
        const other = el("div", "mcother"); other.hidden = true; other.append(ans, btns);
        const groupName = "mc-" + n.name + "-" + q.id;
        const pick = (value, label, isOther) => {
          const lab = el("label", "mcopt" + (isOther ? " other" : ""));
          const radio = el("input"); radio.type = "radio"; radio.name = groupName;
          radio.onchange = () => {
            other.hidden = !isOther;
            if (isOther) { ans.focus(); return; }
            q.answer = value; q.agent = false; q.state = "x"; save(true);
          };
          lab.append(radio, el("span", "", label));
          return lab;
        };
        q.options.forEach((o, i) => mc.append(pick(o, o, false)));
        mc.append(pick(null, "Other…", true));
        const rec = mc.querySelector(".mcopt");
        rec.classList.add("rec");
        rec.title = "Recommended";
        r.append(mc, other);
      } else {
        r.append(ans, btns);
      }
      return r;
    }
    function build() {
      const add = el("input"); add.placeholder = "New question for the human or agent… (Enter)";
      attachComplete(add);
      add.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && add.value.trim() && !document.querySelector(".ac")) {
          qs.push({ id: FT.nextQuestionId(qs), state: " ", text: add.value.trim(), answer: null, agent: false, options: [] });
          save(true);
        }
      });
      return [...qs.map(row), add];
    }
    box.append(...build());
    return field("Questions", box);
  }

  // ---------- drawer ----------
  const drawer = el("div", "drawer");
  drawer.hidden = true;
  document.body.append(drawer);

  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
  };
  const maxW = () => Math.max(320, window.innerWidth - 40);
  function setDrawerWidth(w) {
    drawer.style.width = Math.min(maxW(), Math.max(320, w)) + "px";
    drawer.style.maxWidth = "none";
  }
  setDrawerWidth(Number(store.get("ft.drawerW")) || 560);
  if (window.ResizeObserver) new ResizeObserver(() => drawer.querySelectorAll("textarea").forEach((t) => t.dispatchEvent(new Event("ft-fit")))).observe(drawer);
  const grip = el("div", "grip");
  grip.title = "Drag to resize";
  grip.onpointerdown = (e) => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    grip.onpointermove = (m) => setDrawerWidth(window.innerWidth - m.clientX);
    grip.onpointerup = () => { grip.onpointermove = grip.onpointerup = null; store.set("ft.drawerW", String(drawer.offsetWidth)); };
  };

  function select(name) {
    selected = name;
    renderDrawer();
  }

  function renderDrawer() {
    const n = nodes.get(selected);
    drawer.hidden = !n;
    drawer.replaceChildren(grip);
    if (!n) return;
    const head = el("div", "dhead");
    const dot = el("span", "sdot"); dot.dataset.status = n.status; dot.title = "status: " + n.status + " (see Metadata to change)";
    head.append(dot, el("span", "dtitle", n.name));
    const x = el("span", "btn", "✕"); x.title = "Close";
    x.onclick = () => { selected = null; renderDrawer(); };
    const wide = el("span", "btn", "⤢"); wide.title = "Page width: toggle a one-page editing view";
    wide.onclick = () => {
      const full = drawer.offsetWidth < 900;
      setDrawerWidth(full ? Math.min(980, maxW()) : 560);
      drawer.classList.toggle("page", full);
      store.set("ft.drawerW", String(drawer.offsetWidth));
      renderDrawer();
    };
    head.append(wide, x);
    drawer.append(head);
    drawer.append(metaByline(n));
    const jump = el("div", "jump");
    for (const s of FT.SECTIONS.filter((s) => s !== "Children")) {
      const a = el("span", "chip", s);
      a.onclick = () => { const f = [...drawer.querySelectorAll(".field > label, .afield > summary > label")].find((l) => l.textContent === s); if (f) f.closest(".field,.afield").scrollIntoView({ behavior: "smooth", block: "start" }); };
      jump.append(a);
    }
    drawer.append(jump);
    drawer.append(section(n, "Abstract", "What it is and why it is needed. Use [[node]] to reference features."));
    drawer.append(section(n, "Methodology", "How it works: approach, steps and rules, edge cases, data it keeps, and why. Plain language, no code."));
    drawer.append(acceptanceSection(n));
    drawer.append(todoBox(n));
    drawer.append(questionBox(n));
    drawer.append(section(n, "Implemented", "Documentation of what exists."));
    drawer.append(section(n, "Facts & Details", "Prose distilled from confirmed questions — facts, decisions, constraints."));
    drawer.append(section(n, "Citations", "- [Title](https://…)"));
    drawer.append(archivedSection(n));
  }

  // ---------- floating tree-wide todo box ----------
  const tf = { tab: "todos", qstates: new Set([" ", "~"]), pris: new Set(["0", "1", "2", "3", "?"]), under: "", q: "", done: false };
  const tbox = el("div", "todobox");
  tbox.hidden = true;
  const thead = el("div", "thead");
  const tcount = el("span", "tcount");
  const tclose = el("span", "btn", "✕");
  tclose.title = "Close";
  tclose.onclick = () => { tbox.hidden = true; renderToolbar(); };
  const tabTodos = el("span", "tab on", "Todos");
  const tabQs = el("span", "tab", "Questions");
  tabTodos.onclick = () => { tf.tab = "todos"; refreshTodoBox(); };
  tabQs.onclick = () => { tf.tab = "questions"; refreshTodoBox(); };
  const tabNeeds = el("span", "tab", "Needs you");
  tabNeeds.onclick = () => { tf.tab = "needs"; refreshTodoBox(); };
  thead.append(tabTodos, tabQs, tabNeeds, tcount, tclose);
  const tfilters = el("div", "tfilters");
  const chips = el("div", "chips");
  for (const v of ["0", "1", "2", "3", "?"]) {
    const c = el("span", "chip on p" + v, "P" + v);
    c.onclick = () => { tf.pris.has(v) ? tf.pris.delete(v) : tf.pris.add(v); c.classList.toggle("on", tf.pris.has(v)); refreshTodoBox(); };
    chips.append(c);
  }
  const qchips = el("div", "chips");
  for (const [v, label] of [[" ", "open"], ["~", "to confirm"], ["x", "answered"]]) {
    const c = el("span", "chip on q" + (v === " " ? "o" : v === "~" ? "p" : "d"), label);
    c.onclick = () => { tf.qstates.has(v) ? tf.qstates.delete(v) : tf.qstates.add(v); c.classList.toggle("on", tf.qstates.has(v)); refreshTodoBox(); };
    qchips.append(c);
  }
  qchips.hidden = true;
  const under = el("select");
  under.onchange = () => { tf.under = under.value; refreshTodoBox(); };
  const search = el("input"); search.placeholder = "filter text…";
  search.oninput = () => { tf.q = search.value.toLowerCase(); refreshTodoBox(); };
  const doneLbl = el("label", "dl");
  const doneCb = el("input"); doneCb.type = "checkbox";
  doneCb.onchange = () => { tf.done = doneCb.checked; refreshTodoBox(); };
  doneLbl.append(doneCb, " done");
  tfilters.append(chips, qchips, under, search, doneLbl);
  const tlist = el("div", "tlist");
  tbox.append(thead, tfilters, tlist);
  document.body.append(tbox);

  // drag by header
  let tdrag = null;
  thead.addEventListener("mousedown", (e) => {
    if (e.target.closest(".btn")) return;
    const r = tbox.getBoundingClientRect();
    tdrag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!tdrag) return;
    tbox.style.left = e.clientX - tdrag.dx + "px";
    tbox.style.top = e.clientY - tdrag.dy + "px";
    tbox.style.bottom = "auto";
  });
  window.addEventListener("mouseup", () => { tdrag = null; });

  function descendants(name) {
    const out = new Set([name]);
    (function go(x) { const n = nodes.get(x); if (n) for (const c of n.children) { out.add(c); go(c); } })(name);
    return out;
  }

  function collectTodos() {
    const scope = tf.under && nodes.has(tf.under) ? descendants(tf.under) : null;
    const rows = [];
    for (const n of nodes.values()) {
      if (scope && !scope.has(n.name)) continue;
      n.todos.forEach((t, i) => {
        if (todoState(t) === "x" && !tf.done) return;
        if (!tf.pris.has(t.priority == null ? "?" : String(t.priority))) return;
        if (tf.q && !(t.text + " " + n.name).toLowerCase().includes(tf.q)) return;
        rows.push({ n, t, i });
      });
    }
    const key = (r) => (r.t.priority == null ? 9 : r.t.priority);
    rows.sort((a, b) => key(a) - key(b) || a.n.name.localeCompare(b.n.name) || a.i - b.i);
    return rows;
  }

  function refreshTodoBox() {
    tabTodos.classList.toggle("on", tf.tab === "todos");
    tabQs.classList.toggle("on", tf.tab === "questions");
    tabNeeds.classList.toggle("on", tf.tab === "needs");
    chips.hidden = tf.tab !== "todos";
    doneLbl.hidden = tf.tab !== "todos";
    qchips.hidden = tf.tab !== "questions";
    const needsN = [...nodes.values()].reduce((a, n) => a + n.questions.filter((q) => q.state !== "x").length + n.todos.filter((t) => t.hitl && todoState(t) !== "x").length, 0);
    tabNeeds.textContent = "Needs you" + (needsN ? " (" + needsN + ")" : "");
    const openQs = [...nodes.values()].reduce((a, n) => a + n.questions.filter((q) => q.state === " ").length, 0);
    tabQs.textContent = "Questions" + (openQs ? " (" + openQs + ")" : "");
    if (tf.tab === "questions") refreshQuestionList();
    else if (tf.tab === "needs") refreshQuestionList(true);
    else refreshTodoList();
  }

  function syncUnder() {
    // subtree options follow the tree; keep the current choice when it still exists
    const names = [...nodes.keys()].sort();
    if (under.options.length !== names.length + 1 || names.some((nm, i) => under.options[i + 1].value !== nm)) {
      under.replaceChildren(Object.assign(el("option", "", "whole tree"), { value: "" }));
      for (const nm of names) under.append(Object.assign(el("option", "", nm), { value: nm }));
      if (!nodes.has(tf.under)) tf.under = "";
    }
    under.value = tf.under;
  }

  // needs=true: the human's inbox — open + agent-answered questions (blockers first) plus open human-only (HITL) todos
  function refreshQuestionList(needs) {
    syncUnder();
    const scope = tf.under && nodes.has(tf.under) ? descendants(tf.under) : null;
    const rows = [];
    for (const n of nodes.values()) {
      if (scope && !scope.has(n.name)) continue;
      n.questions.forEach((q, i) => {
        if (needs ? q.state === "x" : !tf.qstates.has(q.state)) return;
        if (tf.q && !(q.text + " " + n.name + " " + (q.answer || "")).toLowerCase().includes(tf.q)) return;
        rows.push({ n, q, i });
      });
    }
    const ord = { " ": 0, "~": 1, x: 2 };
    const nblock = (r) => r.n.todos.filter((t) => todoState(t) !== "x" && t.blocked === r.q.id).length;
    rows.sort((a, b) => (needs ? nblock(b) - nblock(a) : 0) || ord[a.q.state] - ord[b.q.state] || a.n.name.localeCompare(b.n.name) || a.i - b.i);
    const hitl = [];
    if (needs) for (const n of nodes.values()) { if (!scope || scope.has(n.name)) for (const t of n.todos) if (t.hitl && todoState(t) !== "x") hitl.push({ n, t }); }
    tcount.textContent = rows.length + hitl.length + " shown";
    tlist.replaceChildren();
    if (!rows.length && !hitl.length) tlist.append(el("div", "empty", needs ? "nothing needs you" : "no questions match"));
    for (const { n, q } of rows) {
      const blocks = n.todos.filter((t) => todoState(t) !== "x" && t.blocked === q.id).length;
      const r = el("div", "qrow " + (q.state === " " ? "open" : q.state === "~" ? "pend" : "done"));
      const line = el("div", "qline");
      line.append(el("span", "qid", q.id));
      const text = linkify(q.text, el("span", "ttext"), n.path);
      text.onclick = (e) => { if (!e.target.closest(".ref,.ext")) { focusNode(n.name); select(n.name); } };
      const where = el("span", "twhere", n.name);
      where.title = rel(n);
      where.onclick = () => { focusNode(n.name); select(n.name); };
      line.append(text, where);
      r.append(line);
      if (blocks && q.state === " ") r.append(el("div", "qmeta", "⛔ blocks " + blocks + " todo(s)"));
      if (q.answer) r.append(linkify((q.agent ? "agent: " : "") + q.answer, el("div", "qmeta"), n.path));
      if (q.state === " ") {
        const inp = el("input"); inp.placeholder = "Answer… (Enter)";
        attachComplete(inp);
        inp.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" || !inp.value.trim() || document.querySelector(".ac")) return;
          const qs = n.questions.map((x) => (x.id === q.id ? { ...x, state: "x", answer: inp.value.trim(), agent: false } : x));
          writeQuestions(n, qs);
        });
        r.append(inp);
      } else if (q.state === "~") {
        const b = el("button", "", "Confirm");
        b.onclick = () => {
          const qs = n.questions.map((x) => (x.id === q.id ? { ...x, state: "x", agent: false } : x));
          writeQuestions(n, qs);
        };
        r.append(b);
      }
      tlist.append(r);
    }
    for (const { n, t } of hitl) {
      const r = el("div", "qrow open hitl");
      const line = el("div", "qline");
      line.append(el("span", "qid", "👤"));
      const text = linkify(t.text, el("span", "ttext"), n.path);
      text.onclick = (e) => { if (!e.target.closest(".ref,.ext")) { focusNode(n.name); select(n.name); } };
      const where = el("span", "twhere", n.name);
      where.onclick = () => { focusNode(n.name); select(n.name); };
      line.append(text, where);
      r.append(line, el("div", "qmeta", "needs a live human — agents skip this in unattended runs"));
      tlist.append(r);
    }
  }

  function refreshTodoList() {
    syncUnder();
    const rows = collectTodos();
    tcount.textContent = rows.length + " shown";
    tlist.replaceChildren();
    if (!rows.length) tlist.append(el("div", "empty", "no todos match"));
    for (const { n, t, i } of rows) {
      const r = el("div", "trow" + stateClass(todoState(t)));
      const cb = el("select", "tstate");
      cb.dataset.tstate = todoState(t);
      cb.title = "Todo status — pick directly";
      for (const v of [" ", "~", "x"]) cb.append(Object.assign(el("option", "", stateIcon(v)), { value: v }));
      cb.value = todoState(t);
      cb.onchange = () => {
        commit(n, (txt) => FT.setSection(txt, "Todos", FT.formatTodos(n.todos.map((x, j) => (j === i ? { ...x, state: cb.value, done: cb.value === "x" } : x)))));
      };
      const pr = el("span", "pbadge p" + (t.priority == null ? "?" : t.priority), t.priority == null ? "P?" : "P" + t.priority);
      const text = linkify(t.text, el("span", "ttext"), n.path);
      if (t.tle) { r.classList.add("blocked"); text.append(Object.assign(el("span", "blk-tag", " ⏱ TLE " + t.tle), { title: "Aborted at the time limit" })); }
      if (FT.isBlocked(t, n.questions)) { r.classList.add("blocked"); text.append(Object.assign(el("span", "blk-tag", " ⛔ " + t.blocked), { title: "Blocked on an open question" })); }
      if (FT.isBlockedByNode(t, nodes)) { r.classList.add("blocked"); text.append(Object.assign(el("span", "blk-tag", " ⛔ " + t.blockedBy), { title: "Blocked by node " + t.blockedBy + " — not done yet" })); }
      if (t.hitl) text.append(Object.assign(el("span", "hitl-tag", " 👤"), { title: "Needs a live human — excluded from --afk-only runs" }));
      text.onclick = (e) => { if (!e.target.closest(".ref,.ext")) { focusNode(n.name); select(n.name); } };
      const where = el("span", "twhere", n.name);
      where.title = rel(n);
      where.onclick = () => { focusNode(n.name); select(n.name); };
      r.append(cb, pr, text, where);
      tlist.append(r);
    }
  }

  // ---------- graph ----------
  const height = (n) => (expanded.has(n.name) ? H_EXPANDED : H_COLLAPSED);
  const visibleKids = (n) => (folded.has(n.name) ? [] : n.children.map((c) => nodes.get(c)).filter(Boolean));

  function layout(n, depth, top, pos) {
    const kids = visibleKids(n);
    let cursor = top, first = null, last = null;
    for (const k of kids) {
      const h = layout(k, depth + 1, cursor, pos);
      const p = pos.get(k.name);
      if (first === null) first = p.y + height(k) / 2;
      last = p.y + height(k) / 2;
      cursor += h + GAP_Y;
    }
    const kidsH = kids.length ? cursor - GAP_Y - top : 0;
    const own = height(n);
    const y = kids.length ? (first + last) / 2 - own / 2 : top;
    pos.set(n.name, { x: depth * (CARD_W + GAP_X), y: Math.max(y, top) });
    return Math.max(own, kidsH);
  }

  function focusNode(name) {
    let p = nodes.get(name);
    while (p && p.parent && nodes.has(p.parent)) { p = nodes.get(p.parent); folded.delete(p.name); }
    expanded.add(name);
    render();
    const pos = lastPos.get(name);
    if (pos) {
      view.x = viewport.clientWidth / 2 - (pos.x + CARD_W / 2) * view.k;
      view.y = viewport.clientHeight / 2 - (pos.y + height(nodes.get(name)) / 2) * view.k;
      applyView();
    }
    const c = canvas.querySelector('.card[data-name="' + name + '"]');
    if (c) { c.classList.add("flash"); setTimeout(() => c.classList.remove("flash"), 1300); }
  }

  function card(n, p) {
    const c = el("div", "card");
    c.dataset.status = n.status;
    c.dataset.name = n.name;
    if (n.name === selected) c.classList.add("selected");
    c.style.left = p.x + "px";
    c.style.top = p.y + "px";
    c.style.height = height(n) + "px";

    const head = el("div", "head");
    const chev = el("span", "btn", expanded.has(n.name) ? "▾" : "▸");
    chev.title = "Show details";
    chev.onclick = () => { expanded.has(n.name) ? expanded.delete(n.name) : expanded.add(n.name); render(); };
    const title = el("span", "title", n.name);
    title.title = "Edit " + rel(n);
    title.onclick = () => { select(n.name); render(); };
    const unset = n.todos.filter((t) => todoState(t) !== "x" && t.priority == null).length;
    head.append(chev, title);
    if (unset) head.append(Object.assign(el("span", "unset", "P?" + unset), { title: unset + " todo(s) without priority" }));
    const openQ = n.questions.filter((q) => q.state === " ").length;
    if (openQ) head.append(Object.assign(el("span", "qbadge", "?" + openQ), { title: openQ + " open question(s)" }));
    const statusSel = el("select", "badge statussel");
    for (const s of FT.STATUSES) statusSel.append(Object.assign(el("option", "", s), { value: s }));
    statusSel.value = n.status;
    statusSel.dataset.status = n.status;
    statusSel.title = "status — pick directly";
    statusSel.onclick = (e) => e.stopPropagation();
    statusSel.onchange = () => commit(n, (t) => FT.setMeta(t, "status", statusSel.value));
    head.append(statusSel);
    const [rTotal, rDone] = FT.rollupProgress(n, nodes);
    if (rTotal) head.append(Object.assign(el("span", "pctbadge", Math.round((rDone / rTotal) * 100) + "%"), { title: rDone + "/" + rTotal + " todos done across this subtree" }));
    if (n.children.length) {
      const f = el("span", "btn", folded.has(n.name) ? "＋" + n.children.length : "−");
      f.title = "Collapse/expand children";
      f.onclick = () => { folded.has(n.name) ? folded.delete(n.name) : folded.add(n.name); render(); };
      head.append(f);
    }
    c.append(head);

    if (expanded.has(n.name)) {
      const d = el("div", "detail");
      d.append(linkify(n.abstract || "(no abstract)", el("div", "abs"), n.path));
      const open = n.todos.filter((t) => todoState(t) !== "x");
      const counts = el("div", "row");
      for (const pr of [0, 1, 2, 3, null]) {
        const cnt = open.filter((t) => t.priority === pr).length;
        if (cnt) { const s = el("span", "pri"); s.append((pr == null ? "P?" : "P" + pr) + " "); s.append(Object.assign(el("b"), { textContent: cnt })); counts.append(s); }
      }
      if (!open.length) counts.append("no open todos");
      d.append(counts);
      const pend = n.questions.filter((q) => q.state === "~").length;
      const blockedN = n.todos.filter((t) => todoState(t) !== "x" && FT.isBlocked(t, n.questions)).length;
      if (openQ || pend) d.append(el("div", "row", `questions: ${openQ} open${pend ? ", " + pend + " to confirm" : ""}${blockedN ? " · " + blockedN + " todo(s) blocked" : ""}`));
      d.append(el("div", "row", "tests: " + (n.tests || "none") + (n.lastVerified ? " ✓ " + n.lastVerified : "")));
      const links = el("div", "row links");
      for (const r of n.refs) links.append(refChip(r));
      for (const ct of n.citations) links.append(mdLink(ct.text, ct.url, n.path));
      if (links.childNodes.length) d.append(links);
      d.append(el("div", "row", n.words + " words"));
      c.append(d);
    }
    return c;
  }

  const empty = el("div", "emptymsg");
  document.body.append(empty);
  function renderEmpty() {
    empty.hidden = nodes.size > 0;
    if (host.kind === "web") {
      empty.textContent = host.canPick
        ? "No feature tree loaded. Click “open features/ folder” (top-left) and choose your project's features/ directory."
        : "This browser cannot edit local folders. Open this file in Chrome or Edge, or use the VS Code extension.";
    } else {
      empty.textContent = "No feature nodes found in features/. Run `ft new - <name>` or ask Claude to plan with the feature-tree skill.";
    }
  }

  function render() {
    renderEmpty();
    canvas.querySelectorAll(".card").forEach((e) => e.remove());
    edges.replaceChildren();
    const roots = [...nodes.values()].filter((n) => !n.parent || !nodes.has(n.parent));
    const pos = new Map();
    let top = 0;
    for (const r of roots) top += layout(r, 0, top, pos) + GAP_Y * 3;
    lastPos = pos;
    let maxX = 0, maxY = 0;
    for (const [name, p] of pos) {
      const n = nodes.get(name);
      canvas.append(card(n, p));
      maxX = Math.max(maxX, p.x + CARD_W);
      maxY = Math.max(maxY, p.y + height(n));
      for (const k of visibleKids(n)) {
        const q = pos.get(k.name);
        const x1 = p.x + CARD_W, y1 = p.y + height(n) / 2, x2 = q.x, y2 = q.y + height(k) / 2, mx = (x1 + x2) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
        edges.append(path);
      }
    }
    bbox = { w: maxX, h: maxY };
    edges.setAttribute("width", maxX);
    edges.setAttribute("height", maxY);
    applyView();
    renderToolbar();
    refreshTodoBox();
  }

  function renderToolbar() {
    toolbar.replaceChildren();
    if (host.snapshotAt) toolbar.append(Object.assign(el("span", "snapbanner", "snapshot of " + host.snapshotAt + " · read-only"), { title: "This page shows a copy of the plan taken when it was generated. Click “open features/ folder” to see live changes and edit; run `ft view` to refresh the copy." }));
    if (pausedBy !== null) toolbar.append(Object.assign(el("span", "pausedbanner", "⏸ PAUSED — " + pausedBy + " (ft resume)"), { title: "Agents stop picking work until `ft resume`" }));
    for (const [s, c] of Object.entries(COLORS)) {
      const n = [...nodes.values()].filter((x) => x.status === s).length;
      const item = el("span");
      const dot = el("span", "dot"); dot.style.background = c;
      item.append(dot, `${s} ${n}`);
      toolbar.append(item);
    }
    const btn = (label, fn) => { const b = el("button", nodes.size ? "" : "primary", label); b.onclick = fn; toolbar.append(b); };
    if (host.canPick) btn(nodes.size ? "change folder" : "open features/ folder", () => host.pick().catch((e) => toast(e.message)));
    btn(tbox.hidden ? "☑ Todos" : "☑ Hide todos", () => { tbox.hidden = !tbox.hidden; renderToolbar(); });
    btn("expand all", () => { nodes.forEach((n) => expanded.add(n.name)); render(); });
    btn("collapse all", () => { expanded.clear(); render(); });
    btn("fit view", fitView);
  }

  // scale down to fit, keep clear of the (possibly wrapped) toolbar and the drawer
  function fitView() {
    const top = toolbar.offsetHeight + 24;
    const w = viewport.clientWidth - 80 - (drawer.hidden ? 0 : drawer.offsetWidth);
    const h = viewport.clientHeight - top - 20;
    const k = bbox.w && bbox.h ? Math.min(1, w / bbox.w, h / bbox.h) : 1;
    view = { x: 40, y: top, k: Math.max(0.3, k) };
    applyView();
  }

  const applyView = () => { canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`; };

  let drag = null;
  viewport.addEventListener("mousedown", (e) => {
    if (e.target.closest(".card")) return;
    drag = { x: e.clientX - view.x, y: e.clientY - view.y };
    viewport.classList.add("drag");
  });
  window.addEventListener("mousemove", (e) => { if (drag) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; applyView(); } });
  window.addEventListener("mouseup", () => { drag = null; viewport.classList.remove("drag"); });
  viewport.addEventListener("wheel", (e) => {
    e.preventDefault();
    const k = Math.min(2.5, Math.max(0.3, view.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    view.x = e.clientX - ((e.clientX - view.x) / view.k) * k;
    view.y = e.clientY - ((e.clientY - view.y) / view.k) * k;
    view.k = k;
    applyView();
  }, { passive: false });

  let pausedBy = null; // text of features/.paused when a human ran `ft pause`, else null
  host.onFiles((files) => {
    nodes = FT.buildTree(files);
    const pf = files.find((f) => f.path === ".paused");
    pausedBy = pf ? pf.text.trim() || "paused by human" : null;
    if (singleNode) {
      selected = [...nodes.keys()][0];
      // never rebuild the drawer under the user's cursor (debounced autosave round-trips through here)
      if (!drawer.contains(document.activeElement)) renderDrawer();
      return;
    }
    render();
    if (!fitted && nodes.size) { fitted = true; fitView(); }
    // never rebuild the drawer under the user's cursor
    if (!drawer.contains(document.activeElement)) renderDrawer();
  });
  if (!singleNode) { renderEmpty(); renderToolbar(); }
})();
</script></body></html>
