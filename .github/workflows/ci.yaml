name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Plan lint
        run: python3 skill/scripts/ft.py lint
      - name: Plan has no unreflected work
        run: python3 skill/scripts/ft.py reflect --check
      - name: CLI tests
        run: python3 -m unittest discover -s skill/tests
      - name: Viewer tests
        working-directory: vscode-feature-tree
        run: npm ci && npm test
